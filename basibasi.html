  --search-top: 67%;
  --search-left: 58%;

  /* Style */

  --placeholder-color: #ffffff88;

/* =========================
   BASE
   ========================= */

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  height:100vh;
  overflow:hidden;
  background: var(--bg-image) no-repeat center center;
  background-size:cover;
  color:white;
}

/* =========================
   BARRE DE RECHERCHE
   ========================= */

.search-container{
  position:absolute;
  top:var(--search-top);
  left:var(--search-left);
  transform:translate(-50%, -50%);
  width:var(--search-width);
  height:var(--search-height);
}

#searchInput{
  width:100%;
  height:100%;

  padding:0 20px;

  background:transparent;
  border:none;
  outline:none;

  color:var(--text-color);
  font-size:18px;

  /* facultatif : zone cliquable */
  border-radius:30px;
}

#searchInput::placeholder{
  color:var(--placeholder-color);
}

/* =========================
   RÉSULTATS
   ========================= */

.results{
  position:absolute;
  top:var(--results-top);
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:700px;
  padding-bottom:60px;
}

.result{
  background:#121018;
  padding:18px 20px;
  border-radius:14px;
  margin-bottom:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
  transition:transform .15s ease, box-shadow .15s ease;
}

.result:hover{

  box-shadow:0 10px 24px rgba(0,0,0,.35);
}

.result-url{
  font-size:13px;
  color:#8bd3a8;
  margin-bottom:6px;
  word-break:break-all;
}

.result-title a{
  color:#9ecbff;
  text-decoration:none;
  font-size:22px;
  font-weight:bold;
}

.result-title a:hover{
  text-decoration:underline;
}

.result-desc{
  margin-top:8px;
  color:#d7d7d7;
  line-height:1.5;
  font-size:15px;
}

.result-meta{
  margin-top:10px;
  font-size:12px;
  color:#9a9a9a;
}

.no-result{
  background:#121018;
  padding:16px;
  border-radius:12px;
  color:#ddd;
}

/* =========================
   LOGIQUE DE RECHERCHE
   ========================= */

function normalize(text){
  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function tokenize(text){
  return normalize(text).split(" ").filter(Boolean);
}

function search(query){
  const normalizedQuery = normalize(query);
  const queryWords = tokenize(query);

  if(!normalizedQuery) return [];

  const results = [];

  for(const page of searchIndex){
    const titleNorm = normalize(page.title);
    const descNorm = normalize(page.description || "");
    const keywordsNorm = (page.keywords || []).map(k => normalize(k));

    let score = 0;

    for(const word of queryWords){
      if(titleNorm.includes(word)) score += 12;
      if(descNorm.includes(word)) score += 4;

      for(const kw of keywordsNorm){
        if(kw.includes(word) || word.includes(kw)){
          score += 8;
          break;
        }
      }
    }

    if(titleNorm.includes(normalizedQuery)) score += 20;
    if(descNorm.includes(normalizedQuery)) score += 8;

    if(score > 0){
      results.push({...page, score});
    }
  }

  return results.sort((a,b) => b.score - a.score);
}

function escapeHtml(text){
  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================
   INTERACTION (ENTRÉE UNIQUEMENT)
   ========================= */

const input = document.getElementById("searchInput");
const resultsDiv = document.getElementById("results");

input.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    e.preventDefault();
    lancerRecherche(input.value.trim());
  }
});

function lancerRecherche(query){

  resultsDiv.innerHTML = "";

  if(!query){
    resultsDiv.innerHTML = "<div class='no-result'>Entrez une recherche.</div>";
    return;
  }

  const results = search(query);

  if(results.length === 0){
    resultsDiv.innerHTML = "<div class='no-result'>Aucun résultat trouvé.</div>";
    return;
  }

  for(const r of results){
    const el = document.createElement("div");
    el.className = "result";

    el.innerHTML = `
      <div class="result-url">${escapeHtml(r.url)}</div>
      <div class="result-title">
        <a href="${r.url}">${escapeHtml(r.title)}</a>
      </div>
      <div class="result-desc">${escapeHtml(r.description || "")}</div>
      <div class="result-meta">Pertinence : ${r.score}</div>
    `;

    resultsDiv.appendChild(el);
  }
}
