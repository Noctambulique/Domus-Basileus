<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moteur</title>
<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#06040D;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
}

/* logo / entête très compacte */

.header{
margin-top:80px;
margin-bottom:40px;
display:flex;
justify-content:center;
}

.header img{
height:70px;
width:auto;
}

/* zone recherche */

.search-area{
width:90%;
max-width:600px;
text-align:center;
}

input{
width:100%;
padding:14px 18px;
border-radius:30px;
border:none;
font-size:16px;
outline:none;
box-shadow:0 4px 20px rgba(0,0,0,.4);
}

button{
margin-top:20px;
padding:10px 20px;
border:none;
border-radius:20px;
background:#ffffff22;
color:white;
font-size:15px;
cursor:pointer;
}

button:hover{
background:#ffffff33;
}

.results{
margin-top:40px;
width:90%;
max-width:600px;
}

.result{
background:#121018;
padding:14px;
border-radius:10px;
margin-bottom:10px;
}

.result a{
color:white;
text-decoration:none;
font-weight:bold;
}

.result a:hover{
text-decoration:underline;
}

</style>
</head>
<body>

<div class="header">
<img src="Fond/BasiBasi.png" alt="entete">
</div>

<div class="search-area">
<form id="searchForm">
<input id="searchInput" type="text" placeholder="Recherche...">
<button type="submit">Chercher</button>
</form>
</div>

<div id="results" class="results"></div>

<script>

const searchIndex=[
{title:"Jean Dupont",url:"pages/jean.html",keywords:["jean","dupont","jean dupont"]},
{title:"Marie Curie",url:"pages/marie.html",keywords:["marie","curie","marie curie"]},
{title:"Service RH",url:"pages/rh.html",keywords:["rh","ressources humaines","service rh"]}
];

function normalize(text){
return text.toLowerCase().normalize("NFD").replace(/[^a-z0-9 ]/g," ");
}

function search(query){
query=normalize(query);
let results=[];

for(let page of searchIndex){
for(let word of page.keywords){
if(query.includes(normalize(word))){results.push(page);break}
}
}

return results;
}

const form=document.getElementById("searchForm");
const input=document.getElementById("searchInput");
const resultsDiv=document.getElementById("results");

form.addEventListener("submit",function(e){
e.preventDefault();

const query=input.value;
const results=search(query);

resultsDiv.innerHTML="";

if(results.length===0){
resultsDiv.innerHTML="<div class='result'>Aucun résultat</div>";
return;
}

for(let r of results){
const el=document.createElement("div");
el.className="result";
el.innerHTML=`<a href="${r.url}">${r.title}</a>`;
resultsDiv.appendChild(el);
}
});

</script>

</body>
</html>
