function normalize(text){
  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")   // enlève les accents
    .replace(/[^a-z0-9\s]/g, " ")      // enlève ponctuation
    .replace(/\s+/g, " ")
    .trim();
}

function tokenize(text){
  return normalize(text).split(" ").filter(Boolean);
}

function search(query){
  const normalizedQuery = normalize(query);
  const queryWords = tokenize(query);

  if(!normalizedQuery){
    return [];
  }

  const results = [];

  for(const page of searchIndex){
    const titleNorm = normalize(page.title);
    const descNorm = normalize(page.description || "");
    const keywordsNorm = (page.keywords || []).map(k => normalize(k));

    let score = 0;
    let matchedTerms = [];

    for(const word of queryWords){
      if(titleNorm.includes(word)){
        score += 12;
        matchedTerms.push(word);
      }

      if(descNorm.includes(word)){
        score += 4;
        matchedTerms.push(word);
      }

      for(const kw of keywordsNorm){
        if(kw.includes(word) || word.includes(kw)){
          score += 8;
          matchedTerms.push(word);
          break;
        }
      }
    }

    if(titleNorm.includes(normalizedQuery)){
      score += 20;
    }

    if(descNorm.includes(normalizedQuery)){
      score += 8;
    }

    if(score > 0){
      results.push({
        ...page,
        score,
        matchedTerms:[...new Set(matchedTerms)]
      });
    }
  }

  // suppression des doublons par URL
  const uniqueResults = [];
  const seen = new Set();

  for(const item of results.sort((a,b) => b.score - a.score)){
    if(!seen.has(item.url)){
      seen.add(item.url);
      uniqueResults.push(item);
    }
  }

  return uniqueResults;
}

function escapeHtml(text){
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

const form = document.getElementById("searchForm");
const input = document.getElementById("searchInput");
const resultsDiv = document.getElementById("results");

form.addEventListener("submit", function(e){
  e.preventDefault();

  const query = input.value.trim();
  const results = search(query);

  resultsDiv.innerHTML = "";

  if(!query){
    resultsDiv.innerHTML = "<div class='no-result'>Entrez une recherche.</div>";
    return;
  }

  if(results.length === 0){
    resultsDiv.innerHTML = "<div class='no-result'>Aucun résultat trouvé.</div>";
    return;
  }

  for(const r of results){
    const el = document.createElement("div");
    el.className = "result";

    el.innerHTML = `
      <div class="result-url">${escapeHtml(r.url)}</div>
      <div class="result-title">
        <a href="${r.url}">${escapeHtml(r.title)}</a>
      </div>
      <div class="result-desc">${escapeHtml(r.description || "Aucune description disponible.")}</div>
      <div class="result-meta">Pertinence : ${r.score}</div>
    `;

    resultsDiv.appendChild(el);
  }
});
