<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Map interactive</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #map-container {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        cursor: grab;
        position: relative;
        background: #000;
    }

    #map {
        position: absolute;
        top: 0;
        left: 0;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
    }

    .marker {
        position: absolute;
        cursor: pointer;
    }

    #coords {
        position: fixed;
        bottom: 10px;
        left: 10px;
        background: rgba(0,0,0,0.8);
        color: white;
        padding: 8px 12px;
        border-radius: 5px;
        display: none;
        font-size: 14px;
        z-index: 1000;
    }
</style>
</head>

<body>

<div id="map-container">
    <img id="map" src="Fond/Naos.png" alt="map">
</div>

<div id="coords">X: 0 | Y: 0</div>

<script>
const map = document.getElementById("map");
const container = document.getElementById("map-container");
const coordsBox = document.getElementById("coords");

let isDragging = false;
let startX, startY;
let mapX = 0, mapY = 0;
let showCoords = false;
let mouseX = 0, mouseY = 0;

/* --- Limite le déplacement pour ne jamais sortir de l'image --- */
function clampMapPosition(x, y) {
    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;
    const mapWidth = map.offsetWidth;
    const mapHeight = map.offsetHeight;

    const minX = Math.min(0, containerWidth - mapWidth);
    const minY = Math.min(0, containerHeight - mapHeight);
    const maxX = 0;
    const maxY = 0;

    return {
        x: Math.min(maxX, Math.max(minX, x)),
        y: Math.min(maxY, Math.max(minY, y))
    };
}

/* --- Applique le déplacement à la map et aux marqueurs --- */
function updateMapPosition() {
    map.style.transform = `translate(${mapX}px, ${mapY}px)`;
    document.querySelectorAll(".marker").forEach(marker => {
        marker.style.transform = `translate(${mapX}px, ${mapY}px)`;
    });
}

/* --- Déplacement de la map --- */
container.addEventListener("mousedown", e => {
    isDragging = true;
    startX = e.clientX - mapX;
    startY = e.clientY - mapY;
    container.style.cursor = "grabbing";
});

window.addEventListener("mouseup", () => {
    isDragging = false;
    container.style.cursor = "grab";
});

window.addEventListener("mousemove", e => {
    mouseX = e.clientX;
    mouseY = e.clientY;

    if (isDragging) {
        const newX = e.clientX - startX;
        const newY = e.clientY - startY;

        const clamped = clampMapPosition(newX, newY);
        mapX = clamped.x;
        mapY = clamped.y;

        updateMapPosition();
    }

    if (showCoords) {
        coordsBox.innerHTML = `X: ${mouseX} | Y: ${mouseY}`;
    }
});

/* --- Touche A pour afficher les coordonnées --- */
window.addEventListener("keydown", e => {
    if (e.key.toLowerCase() === "a") {
        showCoords = !showCoords;
        coordsBox.style.display = showCoords ? "block" : "none";
    }
});

/* --- Ajouter un marker --- */
function addMarker(x, y, size, image, link) {
    const marker = document.createElement("img");
    marker.src = image;
    marker.className = "marker";
    marker.style.width = size + "px";
    marker.style.left = x + "px";
    marker.style.top = y + "px";
    marker.style.transform = `translate(${mapX}px, ${mapY}px)`;

    marker.addEventListener("click", () => {
        window.location.href = link;
    });

    container.appendChild(marker);
}

/* --- Quand l'image est chargée, on force la position dans les bornes --- */
map.addEventListener("load", () => {
    const clamped = clampMapPosition(mapX, mapY);
    mapX = clamped.x;
    mapY = clamped.y;
    updateMapPosition();
});

/* --- Si la fenêtre change de taille, on rebloque la map dans les limites --- */
window.addEventListener("resize", () => {
    const clamped = clampMapPosition(mapX, mapY);
    mapX = clamped.x;
    mapY = clamped.y;
    updateMapPosition();
});

/* --- Exemples de markers --- */
addMarker(702, 272, 40, "Fond/Lieu.png", "ile.html");
addMarker(848, 447, 40, "Fond/Lieu.png", "ile.html");
</script>

</body>
</html>
