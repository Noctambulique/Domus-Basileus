<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Naos</title>
<link rel="icon" type="image/png" href="Fond/Icone.png"><style>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #map-container {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        cursor: grab;
        position: relative;
        background: #000;
    }

    /* CONTENEUR GLOBAL QUI BOUGE */
    #map-wrapper {
        position: absolute;
        top: 0;
        left: 0;
    }

    #map {
        display: block;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
    }

    .marker {
        position: absolute;
        cursor: pointer;
        transition: transform 0.2s ease, filter 0.2s ease;
    }

    /* Effet hover propre */
    .marker:hover {
        transform: scale(1.15);
        filter: brightness(1.2) drop-shadow(0 0 10px rgba(255,255,255,0.6));
        z-index: 10;
    }
</style>
</head>

<body>

<div id="map-container">
    <div id="map-wrapper">
        <img id="map" src="Fond/Naos.png" alt="map">
    </div>
</div>

<script>
const map = document.getElementById("map");
const container = document.getElementById("map-container");
const wrapper = document.getElementById("map-wrapper");

let isDragging = false;
let startX, startY;
let mapX = 0, mapY = 0;

/* --- Limites de déplacement --- */
function clampMapPosition(x, y) {
    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;
    const mapWidth = map.offsetWidth;
    const mapHeight = map.offsetHeight;

    const minX = Math.min(0, containerWidth - mapWidth);
    const minY = Math.min(0, containerHeight - mapHeight);

    return {
        x: Math.min(0, Math.max(minX, x)),
        y: Math.min(0, Math.max(minY, y))
    };
}

/* --- Mise à jour visuelle --- */
function updateMapPosition() {
    wrapper.style.transform = `translate(${mapX}px, ${mapY}px)`;
}

/* --- Drag --- */
container.addEventListener("mousedown", e => {
    isDragging = true;
    startX = e.clientX - mapX;
    startY = e.clientY - mapY;
    container.style.cursor = "grabbing";
});

window.addEventListener("mouseup", () => {
    isDragging = false;
    container.style.cursor = "grab";
});

window.addEventListener("mousemove", e => {
    if (isDragging) {
        const newX = e.clientX - startX;
        const newY = e.clientY - startY;

        const clamped = clampMapPosition(newX, newY);
        mapX = clamped.x;
        mapY = clamped.y;

        updateMapPosition();
    }
});

/* --- Ajouter un marker --- */
function addMarker(x, y, size, image, link) {
    const marker = document.createElement("img");
    marker.src = image;
    marker.className = "marker";
    marker.style.width = size + "px";
    marker.style.left = x + "px";
    marker.style.top = y + "px";

    marker.addEventListener("click", () => {
        window.location.href = link;
    });

    wrapper.appendChild(marker);
}

/* --- Recalage au chargement --- */
map.addEventListener("load", () => {
    const clamped = clampMapPosition(mapX, mapY);
    mapX = clamped.x;
    mapY = clamped.y;
    updateMapPosition();
});

/* --- Resize --- */
window.addEventListener("resize", () => {
    const clamped = clampMapPosition(mapX, mapY);
    mapX = clamped.x;
    mapY = clamped.y;
    updateMapPosition();
});

/* --- Exemples --- */
addMarker(680, 240, 90, "Fond/Bateau.png", "ile.html");
addMarker(995, 675, 90, "Fond/Immeuble.png", "aube.html");
addMarker(350, 500, 50, "Fond/boutique de Vases.png", "https://noctambulique.github.io/Domus-Basileus/Classeurs.html");
addMarker(700, 700, 50, "Fond/Immeuble Travail.png", "https://noctambulique.github.io/Domus-Basileus/Parler.html");

</script>

</body>
</html>
