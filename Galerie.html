<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerie</title>

<style>
/* ------------------- GLOBAL ------------------- */
body{
  margin:0;
  padding:30px;
  background:linear-gradient(180deg, #3a2f4f 0%, #5a4a6b 50%, #7a6a8c 100%);
  font-family:"Segoe UI", sans-serif;
  color:#fff;
}

h2{
  text-align:center;
  font-weight:300;
  margin-bottom:30px;
  text-shadow:0 2px 8px rgba(0,0,0,0.7);
}

/* ------------------- ZONE ------------------- */
.zone{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:50px;
  padding:50px;

  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  border-radius:18px;

  border:1px solid rgba(255,255,255,0.25);
  box-shadow:
    inset 0 0 20px rgba(255,255,255,0.15),
    0 20px 40px rgba(0,0,0,0.5);
}

/* ------------------- IMAGES ------------------- */
.zone img{
  width:100%;
  height:auto;
  border-radius:10px;
  display:block;

  /* effet gravité (position basse + rotation) */
  transform-origin:center;
  
  box-shadow:
    0 25px 35px rgba(0,0,0,0.7),
    0 0 15px rgba(180,160,255,0.25);

  border:1px solid rgba(255,255,255,0.3);

  transition:
    transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1),
    box-shadow 0.3s,
    filter 0.25s;
}

/* rotations différentes pour effet naturel */
.zone img:nth-child(1){ transform:translateY(10px) rotate(-4deg); }
.zone img:nth-child(2){ transform:translateY(20px) rotate(3deg); }
.zone img:nth-child(3){ transform:translateY(15px) rotate(-2deg); }
.zone img:nth-child(4){ transform:translateY(25px) rotate(5deg); }
.zone img:nth-child(5){ transform:translateY(18px) rotate(-3deg); }
.zone img:nth-child(6){ transform:translateY(22px) rotate(2deg); }

/* ------------------- HOVER ------------------- */
.zone img:hover{
  transform:translateY(-10px) scale(1.12) rotate(0deg);
  filter:brightness(1.1);
  z-index:10;

  box-shadow:
    0 10px 25px rgba(0,0,0,0.6),
    0 0 25px rgba(150,120,255,0.7);
}
</style>
</head>

<body>
