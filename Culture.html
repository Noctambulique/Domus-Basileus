<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Index thématique</title>

<style>
body{
  margin:0;
  height:100vh;
  font-family:"Trebuchet MS", Arial, sans-serif;
  background:url("https://miro.medium.com/v2/resize:fit:1400/1*_zqJUXJaDneHRrXeXtR5vQ.webp") center/cover no-repeat;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* panneau principal */
.panel{
  width:900px;
  padding:30px;
  background:white;
  border-radius:16px;
  box-shadow:
    0 20px 40px rgba(0,0,0,0.25),
    inset 0 0 0 3px #cfe4ff;
}

/* titre principal */
h1{
  margin:0 0 30px;
  text-align:center;
  font-size:1.6rem;
  color:#1e3d63;
}

/* conteneur des 3 zones */
.zones{
  display:flex;
  gap:25px;
}

/* zone individuelle */
.zone{
  flex:1;
}

/* sous-titre */
.zone h2{
  text-align:center;
  font-size:1.1rem;
  margin-bottom:15px;
  color:#3a7bd5;
}

/* items cliquables */
.item{
  display:block;
  padding:12px 14px;
  margin-bottom:12px;
  background:linear-gradient(135deg, #6fb6ff, #3a7bd5);
  border-radius:10px;
  text-decoration:none;
  color:white;
  font-size:0.95rem;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35);
  transition:transform 0.2s ease, box-shadow 0.2s ease;
}

.item:hover{
  transform:translateX(6px);
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,0.6),
    0 6px 14px rgba(58,123,213,0.45);
}
</style>
</head>

<body>

<div class="panel">
  <h1>Ce qui m'intéresse</h1>

  <div class="zones">

    <div class="zone">
      <h2>Court</h2>
      <a class="item" href="SM Créativité obsessionnelle.html">Créativité obsessionnelle</a>
      <a class="item" href="SM Poésie et Marginaux.html">Poésie et Marginalité</a>
      <a class="item" href="SM Ordre et Chaos.html">Ordre et chaos</a>
      <a class="item" href="SM Cartographie mentale.html">Cartographie mentale</a>
    </div>

    <div class="zone">
      <h2>Long</h2>
    <a class="item" href="">Archive Personnelle</a>

    </div>

    <div class="zone">
      <h2>Philosophie</h2>
      <a class="item" href="">Grec</a>
      <a class="item" href="">Moyen Age</a>
      <a class="item" href="">Moderne</a>
      <a class="item" href="">Bibliothèque</a>
    </div>

  </div>
</div>

</body>
</html>
