<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Book</title>

   <style>
body {
    font-family: Georgia, "Times New Roman", serif;
    background: #020102;
    margin: 0;
    padding: 40px;
    color: #ffffff;
    min-height: 100vh;
}

.page {
    max-width: 1200px;
    margin: 0 auto;
}

/* image du haut centrée */
.header-image {
    display: flex;
    justify-content: center;
    margin-bottom: 50px;
}

.header-image img {
    width: 33%;
    min-width: 260px;
    max-width: 480px;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;

    /* suppression totale du cadre */
    border: none;
    border-radius: 0;
    box-shadow: none;
    filter: none;
}

.bibliotheque {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
}

.livre {
    text-align: center;
    width: 170px;
}

.livre img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    cursor: pointer;
    transition: transform 0.25s ease;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: transparent;
}

.livre img:hover {
    transform: scale(1.04);
}

.livre-titre {
    margin-top: 10px;
    font-size: 15px;
    color: #ffffff;
    letter-spacing: 0.4px;
}

.texte {
    display: none;
    max-width: 850px;
    margin: 30px auto 0 auto;
    white-space: pre-line;
    font-size: 17px;
    line-height: 1.9;
    background: #000;
    padding: 35px;
    border-radius: 0;
    box-shadow: none;
    border: none;
}

#contenuTexte {
    color: #ffffff;
}

.retour {
    margin-top: 35px;
    cursor: pointer;
    color: #ffffff;
    font-size: 14px;
    letter-spacing: 0.3px;
}

.retour:hover {
    text-decoration: underline;
}
</style>

</head>
<body>

<div class="page">

    <div class="header-image">
        <img src="Fond/Book.png" alt="Photographie d'ambiance">
    </div>

    <div class="bibliotheque" id="bibliotheque"></div>

    <div class="texte" id="texte">
        <div id="contenuTexte"></div>
        <div class="retour" id="retour">← Retour</div>
    </div>

</div>

<script>
    const livres = [
        {
            image: "Marginal/Couverture/Le Jumeau.png",
texte ;"Le jumeau peut être compris comme l’image d’une version de nous-mêmes débarrassée des influences extérieures. Il ne s’agit d'une version minimum de nous sans influence de l’environnement ou des accidents de l’existence. Ce jumeau représente donc la structure fondamentale de notre être : une sorte de forme intérieure qui contient le moteur de tout ce que nous pouvons devenir. \n \n Il correspond à ce qu’il y a de plus stable et de plus constant en nous, à ce qui demeure derrière les variations de l’expérience. Il correspond à ce qu’il y a de plus stable et de plus constant en nous, à ce qui demeure derrière les variations de l’expérience. On peut le comparer au plan d’une maison : avant que la construction ne soit influencée par le terrain, les réparations ou les transformations au fil des années, il existe un dessin initial qui indique les possibilités de la structure. La vie, avec ses circonstances, modifie ensuite l’édifice, mais ce plan originel continue d’en déterminer les lignes principales. . Il résulte plutôt de la combinaison d’un petit nombre de composantes simples que l’on peut retrouver chez beaucoup d’autres personnes. C’est pourquoi certaines structures profondes de caractère réapparaissent à travers l’histoire. Malgré les différences de culture ou d’époque, on retrouve des noyaux similaires chez des individus séparés par des siècles. \n \n Toutefois, posséder ce noyau ne signifie pas nécessairement le mettre en œuvre. Dans la vie quotidienne, notre manière d’agir est souvent orientée par d’autres logiques que celles qui correspondent à notre nature profonde. Les règles sociales, les habitudes acquises ou les attentes de l’entourage peuvent ainsi nous en détourner. Pour exprimer véritablement notre nature, il ne suffit pas qu’elle existe en nous. Il faut encore la reconnaître, parfois même la construire activement. Si le processus de construction est si efficace, c'est parce qu'il me fait sentir, au fond de moi-même, ce qui me parle ou non. En suivant ce qui me parle, je peux ainsi me retrouver."
        },
        {
            image: "images/livre2.jpg",
            texte: "Titre : Livre 2\n\nUn autre contenu.\nMinimaliste.\nSilencieux."
        },
        {
            image: "images/livre3.jpg",
            texte: "Titre : Livre 3\n\nQuelque chose demeure dans l'ombre.\nLe lieu semble vide,\nmais il ne l'est pas."
        }
    ];

    const bibliotheque = document.getElementById("bibliotheque");
    const texteDiv = document.getElementById("texte");
    const contenuTexte = document.getElementById("contenuTexte");
    const retour = document.getElementById("retour");

    livres.forEach(livre => {
        const blocLivre = document.createElement("div");
        blocLivre.className = "livre";

        const img = document.createElement("img");
        img.src = livre.image;
        img.alt = livre.titre;

        const titre = document.createElement("div");
        titre.className = "livre-titre";
        titre.textContent = livre.titre;

        img.addEventListener("click", () => {
            bibliotheque.style.display = "none";
            contenuTexte.textContent = livre.texte;
            texteDiv.style.display = "block";
        });

        blocLivre.appendChild(img);
        blocLivre.appendChild(titre);
        bibliotheque.appendChild(blocLivre);
    });

    retour.addEventListener("click", () => {
        texteDiv.style.display = "none";
        bibliotheque.style.display = "flex";
    });
</script>

</body>
</html>
