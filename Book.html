<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Book</title>

   <style>
body {
    font-family: Georgia, "Times New Roman", serif;
    background: #020102;
    margin: 0;
    padding: 40px;
    color: #ffffff;
    min-height: 100vh;
}

.page {
    max-width: 1200px;
    margin: 0 auto;
}

/* image du haut centrée */
.header-image {
    display: flex;
    justify-content: center;
    margin-bottom: 50px;
}

.header-image img {
    width: 33%;
    min-width: 260px;
    max-width: 480px;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;

    /* suppression totale du cadre */
    border: none;
    border-radius: 0;
    box-shadow: none;
    filter: none;
}

.bibliotheque {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
}

.livre {
    text-align: center;
    width: 170px;
}

.livre img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    cursor: pointer;
    transition: transform 0.25s ease;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: transparent;
}

.livre img:hover {
    transform: scale(1.04);
}

.livre-titre {
    margin-top: 10px;
    font-size: 15px;
    color: #ffffff;
    letter-spacing: 0.4px;
}

.texte {
    display: none;
    max-width: 850px;
    margin: 30px auto 0 auto;
    white-space: pre-line;
    font-size: 17px;
    line-height: 1.9;
    background: #000;
    padding: 35px;
    border-radius: 0;
    box-shadow: none;
    border: none;
}

#contenuTexte {
    color: #ffffff;
}

.retour {
    margin-top: 35px;
    cursor: pointer;
    color: #ffffff;
    font-size: 14px;
    letter-spacing: 0.3px;
}

.retour:hover {
    text-decoration: underline;
}
</style>

</head>
<body>

<div class="page">

    <div class="header-image">
        <img src="Fond/Book.png" alt="Photographie d'ambiance">
    </div>

    <div class="bibliotheque" id="bibliotheque"></div>

    <div class="texte" id="texte">
        <div id="contenuTexte"></div>
        <div class="retour" id="retour">← Retour</div>
    </div>

</div>

<script>
    const livres = [
        {
            image: "Marginal/Couverture/Le Jumeau.png",
        texte: "Le jumeau peut être compris comme l’image d’une version de nous-mêmes débarrassée des influences extérieures. Ce jumeau représente donc la structure fondamentale de notre être. Il correspond à ce qu’il y a de plus stable et de plus constant en nous. Il résulte de la combinaison d’un petit nombre de composantes simples que l’on peut retrouver partout. Il est, en quelque sorte, comparable en tout point à un corps. En effet, je peux renvoyer des impressions différentes selon la manière dont je m’habille ou me coiffe, mais mon corps, en lui-même, demeure identique, quelle que soit la façon dont je me présente. \n \n Ce corps est composé d’un ensemble d’éléments : un nez d’une certaine longueur, une bouche possédant certaines caractéristiques, une couleur d’yeux particulière.  Bien que mon visage ne soit jamais totalement identique à celui d’une autre personne, il arrive néanmoins que certains possèdent le même type de nez que moi, la même couleur d’yeux ou encore une forme de bouche semblable. De la même manière certaines structures d'existence sont susceptibles d'être partagées d'un siècle à l'autre. Le jumeau n'est donc pas quelque chose que je possède de façon propre, mais qui est susceptible d'être partagé par d'autres que moi. Ensemble, nous faisons vivre des choses différentes à ce jumeau, de la même manière que l'on peut habiller un corps par un tas de moyens. \n \n Les chemins que vont prendre les personnalités dépendent de ce qu'elles sont intrinsèquement, mais également de facteurs environnementaux et d'une part de hasard. Il y a également un facteur culturel en ce que, dès lors que je regarde ce qui s'est déjà produit et que je deviens capable d'identifier qui me ressemble, alors je peux avoir des pistes quant aux évolutions probables qui pourraient être les miennes et donc m'ajuster en conséquence afin de vivre une autre vie que celle qui m'aurait été donnée. Cette nouvelle histoire que je produirai s'inscrira elle-même dans la culture, créant de nouvelles conventions et donc changeant à nouveau le sens du jeu."
        },
        {
            image: "images/livre2.jpg",
            texte: "Titre : Livre 2\n\nUn autre contenu.\nMinimaliste.\nSilencieux."
        },
        {
            image: "images/livre3.jpg",
            texte: "Titre : Livre 3\n\nQuelque chose demeure dans l'ombre.\nLe lieu semble vide,\nmais il ne l'est pas."
        }
    ];

    const bibliotheque = document.getElementById("bibliotheque");
    const texteDiv = document.getElementById("texte");
    const contenuTexte = document.getElementById("contenuTexte");
    const retour = document.getElementById("retour");

    livres.forEach(livre => {
        const blocLivre = document.createElement("div");
        blocLivre.className = "livre";

        const img = document.createElement("img");
        img.src = livre.image;
        img.alt = livre.titre;

        const titre = document.createElement("div");
        titre.className = "livre-titre";
        titre.textContent = livre.titre;

        img.addEventListener("click", () => {
            bibliotheque.style.display = "none";
            contenuTexte.textContent = livre.texte;
            texteDiv.style.display = "block";
        });

        blocLivre.appendChild(img);
        blocLivre.appendChild(titre);
        bibliotheque.appendChild(blocLivre);
    });

    retour.addEventListener("click", () => {
        texteDiv.style.display = "none";
        bibliotheque.style.display = "flex";
    });
</script>

</body>
</html>
