<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
<title>Book</title>
<link rel="icon" type="image/png" href="Fond/Icone.png">

   <style>
body {
    font-family: Georgia, "Times New Roman", serif;
    background: #020102;
    margin: 0;
    padding: 40px;
    color: #ffffff;
    min-height: 100vh;
}

.page {
    max-width: 1200px;
    margin: 0 auto;
}

/* image du haut centrée */
.header-image {
    display: flex;
    justify-content: center;
    margin-bottom: 50px;
}

.header-image img {
    width: 33%;
    min-width: 260px;
    max-width: 480px;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;

    /* suppression totale du cadre */
    border: none;
    border-radius: 0;
    box-shadow: none;
    filter: none;
}

.bibliotheque {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
}

.livre {
    text-align: center;
    width: 170px;
}

.livre img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    cursor: pointer;
    transition: transform 0.25s ease;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: transparent;
}

.livre img:hover {
    transform: scale(1.04);
}

.livre-titre {
    margin-top: 10px;
    font-size: 15px;
    color: #ffffff;
    letter-spacing: 0.4px;
}

.texte {
    display: none;
    max-width: 850px;
    margin: 30px auto 0 auto;
    white-space: pre-line;
    font-size: 17px;
    line-height: 1.9;
    background: #000;
    padding: 35px;
    border-radius: 0;
    box-shadow: none;
    border: none;
}

#contenuTexte {
    color: #ffffff;
}

.retour {
    margin-top: 35px;
    cursor: pointer;
    color: #ffffff;
    font-size: 14px;
    letter-spacing: 0.3px;
}

.retour:hover {
    text-decoration: underline;
}
</style>

</head>
<body>

<div class="page">

    <div class="header-image">
        <img src="Fond/Book.png" alt="Photographie d'ambiance">
    </div>

    <div class="bibliotheque" id="bibliotheque"></div>

    <div class="texte" id="texte">
        <div id="contenuTexte"></div>
        <div class="retour" id="retour">← Retour</div>
    </div>

</div>

<script>
    const livres = [
        {
            image: "Marginal/Couverture/Le Jumeau.png",
            texte: " Le jumeau peut être compris comme l’image d’une version de nous-mêmes débarrassée des influences extérieures. Ce jumeau représente donc la structure fondamentale de notre être. Il correspond à ce qu’il y a de plus stable et de plus constant en nous. Il est, en quelque sorte, comparable en tout point à un corps. En effet, je peux renvoyer des impressions différentes selon la manière dont je m’habille ou me coiffe, mais mon corps, en lui-même, demeure identique, quelle que soit la façon dont je me présente.  \n \n Le corps résulte de la combinaison d’un petit nombre de composantes simples que l’on peut retrouver partout. S'il est improbable de découvrir une personne avec la même apparence que nous, il  est possible de découvrir des corps similaires aux nôtres. De la même manière certaines logiques d'existence sont susceptibles d'être partagées d'un siècle à l'autre. Le jumeau n'est donc pas quelque chose que je possède de façon propre, mais qui est susceptible d'être partagé par d'autres que moi. Ensemble, nous faisons vivre des choses différentes à ce jumeau, de la même manière que l'on peut habiller un corps par un tas de moyens.  \n \n Les chemins que vont prendre les personnalités dépendent de ce qu'elles sont intrinsèquement, mais également de facteurs environnementaux et d'une part de hasard. Il y a également un facteur culturel en ce que, dès lors que je regarde ce qui s'est déjà produit et que je deviens capable d'identifier qui me ressemble, alors je peux avoir des pistes quant aux évolutions probables qui pourraient être les miennes et donc m'ajuster en conséquence afin de vivre une autre vie que celle qui m'aurait été donnée. Cette nouvelle histoire que je produirai s'inscrira elle-même dans la culture, créant de nouvelles conventions et donc changeant à nouveau le sens du jeu."
        },
        {
            image: "Marginal/Couverture/Posture.png",
            texte: "1) Joueur\n Remplir veut dire habiter un vide. Ce vide est une inexpérience, un manque ou quelque chose qui n'a pas trouvé de solution et demeure donc en attente d'être comblé. Lorsque je remplis, j'accumule des choses dans un espace. \n \n Le joueur est une figure de conscience qui vise à remplir. C'est une posture alterne entre impersonnel, personnel et fondamental en trompant sur sa position, en jouant plusieurs lignes.\n \n C’est une figure de conscience car son but est de chercher la logique d’existence d’une personne, d’anticiper son avenir en rendant compte de son expérience intérieure. Pour comprendre de ce qu'est existence d'une personne, il faut être capable de la voir sans doute à sa puissance, de nommer ses ambiguités. Il faut ensuite être capable de saisir sa volonté et de quelle façon cette volonté interagit avec sa puissance.\n \n 2) L’Archer\n Sceller consiste à enfermer quelque chose de façon définitive. Lorsque je ferme quelque chose, je mets fin à son ouverture. Ce qui est scellé est donc figé dans un certain état. Ainsi, lorsque je scelle, j'abolis le temps.\n La seconde posture, l'archer, est une position de conscience. Cette dernière s'appuie sur le mode fondamental. Son but est d'abolir le temps avec autrui. Il s'agit donc d'une position qui ne parle que pour poser des grandes lignes sur lesquelles faire marcher autrui. C'est la seule posture qui n'a pas besoin d'être en contact avec autrui pour véritablement agir.\n \n 3) Loup\n Déborder veut dire abolir le cadre. Lorsque je déborde, je sors de la convenance, je transcende ce qui était en place. Ainsi, il n'y a pas de débordement sans une part de chaos, ni sans rebattre les cartes. Le meilleur débordement est celui qu’on ne peut pas arrêter.\n \n La troisième posture est celle du loup. Le loup peut être impersonnel ou fondamental. C'est une position de force qui vise à créer du débordement. L'idée du loup est de très peu parler, mais d'agir. En combinant impersonnel et fondamental il acquiert une grande force."
       },
                {
            image: "Marginal/Couverture/Personnalité.png",
            texte: "La personnalité triadique est marquée par une forte tension entre quête d’idéal et transgression. Animée par une recherche de pureté et un réel intérêt pour autrui, elle reste pourtant marginale, attirée par les zones de conflit, de chaos et de remise en cause des normes. Son imaginaire est puissant : elle crée des univers, nourrit une sensibilité esthétique et une nostalgie persistante qui colore sa vision du monde. Sa présence peut déborder sur les autres. Il y a en elle une recherche d'efficacité concrète.\n \n La personnalité mythique impose souvent son propre rythme aux situations et aux échanges. Elle cherche spontanément ce qui se cache derrière les évidences. Sa lucidité la conduit parfois à remettre en question la manière dont les autres perçoivent la réalité. Elle crée autour d’elle une forme d’ambiguïté. Ses intentions restent souvent opaques, ce qui peut troubler ceux qui l’observent. Dans les relations, elle agit avec une certaine stratégie. Elle avance avec prudence, laissant rarement voir l’ensemble de son jeu.\n \n La personnalité rare est capable d’initiative qui pousse naturellement à l’action. Elle n’accumule pas forcément les projets, mais lorsqu’elle décide d’avancer, elle le fait avec des plans clairs et une détermination réelle. Sa force intérieure et son esprit combatif lui permettent de s’imposer lorsque c’est nécessaire. Elle sait convaincre, souvent par la conviction qu’elle met dans ce qu’elle entreprend. Sa présence peut inspirer les autres, même si elle reste fondamentalement assez solitaire. Il y a chez elle une part d’ego qui nourrit son affirmation et sa volonté d’aller au bout de ses idées. Elle avance souvent à sa manière, parfois de façon inattendue. Cette capacité à surprendre participe aussi à son influence.\n \n La personnalité saine s’appuie sur un socle intérieur clair et agit en cohérence avec ce qu’elle estime juste. Elle assume naturellement ce qui lui revient, sans chercher l’approbation pour avancer. Sa manière d’être est simple et authentique : ce qu’elle montre correspond largement à ce qu’elle est. Dans les relations, elle se déplace avec aisance, attentive aux autres sans perdre sa propre position. Quand une limite doit être posée, elle le fait calmement mais sans hésiter. Sa fermeté n’est jamais froide, car elle reste sensible aux fragilités autour d’elle. On sent chez elle une capacité à soutenir et à protéger. Sa présence inspire confiance parce qu’elle unit stabilité intérieure et humanité.\n \n La personnalité névrosée semble souvent prise dans des boucles mentales où les pensées et les émotions se renforcent mutuellement. Elle ressent intensément les situations, au point que l’émotion déborde parfois sa capacité à prendre du recul. Face aux difficultés, elle a tendance à subir plutôt qu’à transformer ce qui lui arrive. Le changement lui paraît lourd, presque menaçant, ce qui la maintient dans des schémas familiers. Son regard peut facilement projeter des intentions excessives chez les autres, nourrissant une méfiance diffuse. Les nuances deviennent alors difficiles à maintenir. Pour se rassurer, elle pose des règles rigides mais souvent creuses. Au fond, cette tension intérieure la conduit parfois à se faire du mal à elle-même.\n"
    },
            {
            image: "Marginal/Couverture/Matrice.png",
            texte: "L’existence humaine se déploie entre deux dimensions :\n • la pensée, à travers ce que l’on peut nommer conscience\n • la réalité, qui produit ce que l’on peut nommer force\n Ces dimensions obéissent à des logiques distinctes. \n \n La pensée est libre : elle peut concevoir l’impossible, défier les lois physiques, imaginer l’irréalisable. La réalité, en revanche, impose ses limites : elle est contrainte par des lois physiques. Ainsi, la conscience et la force évoluent chacune selon des règles propres. Elles ne se confondent pas. Une rencontre est pourtant possible. Parfois, une pensée semble anticiper un événement réel, ou un évènement rejoint une pensée. \n \n Ainsi, chaque individu est composé de ces deux paramètres\n • une intensité de conscience (pensée) et de force (réalité),\n • un lien entre le physique et le mental.\n \n Ce lien se manifeste à trois niveaux :\n • Impersonnel : ce qui ne trouble rien\n • Personnel : ce qui nous touche, nous implique, nourrit un jeu, une expérimentation \n • Fondamental : ce qui nous structure en profondeur \n \n Ce dernier niveau est souvent parasité d’interrogations fondamentales. Notre manière d’y répondre — ou d’y échapper — manifeste notre rapport à nous-mêmes. Elle dévoile ce que nous sommes capables d’assumer,  les tensions internes qui nous traversent, notre potentiel de transformation.\n \n Un corps est la rencontre entre une conscience (une intention, une pensée) et une force (une capacité d’agir). Mais cette dynamique peut s’étendre au-delà de soi. Lorsque j’interprète autrui, je ne fais pas qu’observer : je produis un regard qui peut influencer sa propre perception. Lorsque j’agis, je transforme la vision que l’on a de moi. Autrement dit ma conscience peut devenir active en l’autre, ma force peut nourrir sa conscience. Cela signifie que l’on peut se mêler avec autrui. \n \n Ces rapports sont sans cesse influencés par des jeux de langage, dans lesquels on invite l’autre à nous regarder, à faire, à ne pas regarder ou à ne pas faire. Cela se manifeste à un niveau primaire par des phrases isolées comme « Fais ceci / fais pas ça » ou  « Regarde / ne regarde pas », et à un niveau plus élevé par des stratégies plus complexes."
        },
            {
            image: "Marginal/Couverture/Organisation.png",
            texte: "La Domus Basileus s’organise en trois sections distinctes, chacune répondant à une fonction précise dans l’architecture d’ensemble.\n \n La première section correspond au moteur de recherche BasiBasi. Celui-ci donne accès à un ensemble de pages de moindre importance dans la construction de ma personnalité. Néanmoins, ces éléments ont suscité des émotions significatives, éveillé un certain bonheur ou retenu ponctuellement mon attention. Il n'y a ici que ce que l'on cherche.\n \n La deuxième section, également accessible au sein de la Domus Basileus, est structurée autour de trois villes : Naos, l'ile et l’aube. Chacune d’elles renvoie à une esthétique singulière et se présente sous la forme d’une carte. Ces espaces donnent accès aux éléments qui ont constitué des piliers essentiels dans mon processus de formation personnelle. Pour trouver ce qui compte, il faut explorer.\n \n Enfin, la troisième section, intitulée Boucle, rassemble mes réflexions les plus fondamentales, portant à la fois sur le monde et sur la relation que j’entretiens avec celui-ci. Ici, tout se donne à la pensée, il n'y a qu'à consulter."
        }
    ];

    const bibliotheque = document.getElementById("bibliotheque");
    const texteDiv = document.getElementById("texte");
    const contenuTexte = document.getElementById("contenuTexte");
    const retour = document.getElementById("retour");

    livres.forEach(livre => {
        const blocLivre = document.createElement("div");
        blocLivre.className = "livre";

        const img = document.createElement("img");
        img.src = livre.image;
        img.alt = livre.titre;

        const titre = document.createElement("div");
        titre.className = "livre-titre";
        titre.textContent = livre.titre;

        img.addEventListener("click", () => {
            bibliotheque.style.display = "none";
            contenuTexte.textContent = livre.texte;
            texteDiv.style.display = "block";
        });

        blocLivre.appendChild(img);
        blocLivre.appendChild(titre);
        bibliotheque.appendChild(blocLivre);
    });

    retour.addEventListener("click", () => {
        texteDiv.style.display = "none";
        bibliotheque.style.display = "flex";
    });
</script>

</body>
</html>
