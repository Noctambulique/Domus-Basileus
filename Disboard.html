<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Disboard Philo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #1e293b;
      font-size: 24px;
    }

    .controls {
      padding: 15px;
      background: #111827;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    input, select {
      padding: 8px;
      border-radius: 6px;
      border: none;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .tag {
      display: inline-block;
      margin-top: 5px;
      background: #3b82f6;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 12px;
    }

    .desc {
      margin-top: 10px;
      font-size: 14px;
    }

    button {
      margin-top: 10px;
      padding: 6px 10px;
      border: none;
      border-radius: 5px;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>📜 Serveurs Philosophie</header>

<div class="controls">
  <input type="text" id="search" placeholder="Rechercher...">
  <select id="filter">
    <option value="all">Tous</option>
    <option value="existentialisme">Existentialisme</option>
    <option value="epistemologie">Épistémologie</option>
    <option value="ethique">Éthique</option>
  </select>
</div>

<div class="container" id="serverList"></div>

<script>
  const servers = [
    {
      name: "Agora Existentialiste",
      tag: "existentialisme",
      desc: "Discussion Sartre, Camus, liberté et absurdité.",
      link: "#"
    },
    {
      name: "Cercle Éthique",
      tag: "ethique",
      desc: "Morale, responsabilité et dilemmes modernes.",
      link: "#"
    },
    {
      name: "Laboratoire Épistémologique",
      tag: "epistemologie",
      desc: "Science, vérité, et construction du savoir.",
      link: "#"
    }
  ];

  const container = document.getElementById("serverList");

  function display(list) {
    container.innerHTML = "";
    list.forEach(s => {
      container.innerHTML += `
        <div class="card">
          <div class="title">${s.name}</div>
          <div class="tag">${s.tag}</div>
          <div class="desc">${s.desc}</div>
          <button onclick="window.open('${s.link}')">Rejoindre</button>
        </div>
      `;
    });
  }

  document.getElementById("search").addEventListener("input", e => {
    const value = e.target.value.toLowerCase();
    const filtered = servers.filter(s => s.name.toLowerCase().includes(value));
    display(filtered);
  });

  document.getElementById("filter").addEventListener("change", e => {
    const value = e.target.value;
    if (value === "all") return display(servers);
    display(servers.filter(s => s.tag === value));
  });

  display(servers);
</script>

</body>
</html>
