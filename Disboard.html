<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Discord UI Style</title>

<style>
:root {
  --card-bg: rgba(20, 22, 30, 0.85);
  --card-radius: 12px;
  --accent: #2ecc71;
  --text-main: #ffffff;
  --text-muted: #9aa0a6;
  --tag-bg: #2a2d3a;
}

/* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

/* Background */
body {
  height: 100vh;
  background: url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f")
              center/cover no-repeat fixed;
  display: flex;
  align-items: center;
  justify-content: center;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  backdrop-filter: blur(10px);
  background: rgba(0,0,0,0.5);
}

/* Container */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  width: 80%;
  z-index: 1;
}

/* Card */
.server-card {
  background: linear-gradient(
    180deg,
    rgba(30,30,40,0.9),
    rgba(15,15,20,0.95)
  );
  border-radius: var(--card-radius);
  padding: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.05);
  transition: transform 0.2s ease;
}

.server-card:hover {
  transform: translateY(-5px);
}

/* Header */
.server-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.server-icon {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  object-fit: cover;
}

.server-title {
  font-weight: 600;
  color: var(--text-main);
}

/* Count */
.server-count {
  font-size: 12px;
  color: var(--text-muted);
}

.server-count::before {
  content: "●";
  color: var(--accent);
  margin-right: 6px;
}

/* Tags */
.tags {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tag {
  background: var(--tag-bg);
  color: var(--text-main);
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 6px;
}
</style>

</head>
<body>

<div class="container">

  <div class="server-card">
    <div class="server-header">
      <img class="server-icon" src="https://picsum.photos/50">
      <div>
        <div class="server-title">L'Aqueduc</div>
        <div class="server-count">37 · il y a 11 minutes</div>
      </div>
    </div>
    <div class="tags">
      <span class="tag">DISCUSSION</span>
      <span class="tag">SCIENCE</span>
      <span class="tag">POLITIQUE</span>
      <span class="tag">DÉBAT</span>
      <span class="tag">PHILOSOPHIE</span>
    </div>
  </div>

  <div class="server-card">
    <div class="server-header">
      <img class="server-icon" src="https://picsum.photos/51">
      <div>
        <div class="server-title">La Cité Libre</div>
        <div class="server-count">202 · il y a 51 minutes</div>
      </div>
    </div>
    <div class="tags">
      <span class="tag">CULTURE</span>
      <span class="tag">DISCUSSION</span>
      <span class="tag">POLITIQUE</span>
      <span class="tag">DÉBATS</span>
      <span class="tag">PHILOSOPHIE</span>
    </div>
  </div>

  <div class="server-card">
    <div class="server-header">
      <img class="server-icon" src="https://picsum.photos/52">
      <div>
        <div class="server-title">Arène des Débats</div>
        <div class="server-count">535 · il y a 58 minutes</div>
      </div>
    </div>
    <div class="tags">
      <span class="tag">SCIENCE</span>
      <span class="tag">RELIGION</span>
      <span class="tag">POLITIQUE</span>
      <span class="tag">DÉBAT</span>
    </div>
  </div>

</div>

</body>
</html>
