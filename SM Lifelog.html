<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
:root {
  --gap: 22px;
  --radius: 14px;

  --aero-blue-top: #54c7ff;
  --aero-blue-bottom: #0073d9;

  --aero-green: #8bf25b;
  --aero-white: #e8faff;
  --aero-glass: rgba(255, 255, 255, 0.55);

  --shadow-dark: 0 8px 22px rgba(0, 0, 0, 0.45);
}

/* FOND FRUTIGER AERO */
html, body {
  margin: 0;
  height: 100%;
  font-family: "Segoe UI", Tahoma, sans-serif;
  background:
    radial-gradient(circle at 70% 20%, #bafffc 0%, #5dc8ff 35%, #0074d9 100%);
  background-attachment: fixed;
  color: #002242;
  overflow-x: hidden;
}

/* Ajout nuageux + bulles flottantes */
html::before {
  content:"";
  position: fixed;
  top:0; left:0;
  width:100vw; height:100vh;
  pointer-events:none;
  background:
    url('Fond/F3 Ville au loin.jpg') center/cover no-repeat;
  opacity: .22;
  filter: blur(2px);
}

/* Mise en page */
.wrap {
  max-width: 1150px;
  margin: 0 auto;
  padding: 38px;
  box-sizing: border-box;
}

/* Titres façon Vista */
.title {
  font-weight: 600;
  margin: 0 0 14px;
  color: #003e73;
  text-shadow: 0 2px 0 rgba(255,255,255,.7);
}

/* Grille */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--gap);
}

/* VRAIES CARTES FRUTIGER AERO */
.card {
  position: relative;
  border-radius: var(--radius);
  overflow:hidden;
  min-height: 180px;
  border: 1px solid rgba(255,255,255,0.8);

  background: linear-gradient(
    135deg,
    var(--aero-white) 0%,
    rgba(255,255,255,.75) 40%,
    var(--aero-glass) 100%
  );
  box-shadow:
    var(--shadow-dark),
    inset 0 0 20px rgba(255,255,255,0.7);

  cursor: pointer;
  transition: .18s ease-out;
  backdrop-filter: blur(4px);
}

/* Reflet glossy typique Web 2.0 */
.card::before {
  content:"";
  position:absolute;
  top:0; left:0;
  width:100%; height:45%;
  background:linear-gradient(
    rgba(255,255,255,.85),
    rgba(255,255,255,.1)
  );
  pointer-events:none;
}

.card:hover {
  transform: translateY(-6px) scale(1.03);
  box-shadow:
    0 12px 26px rgba(0,0,0,.5),
    inset 0 0 26px rgba(255,255,255,.92);
  border-color: #7befff;
}

.card img {
  width:100%; height:100%;
  object-fit:cover;
}

/* READER : FENÊTRE AERO SUREXPLOSÉE */
.reader {
  position:relative;
  min-height:360px;
  border-radius: var(--radius);
  padding:40px;
  border:1px solid #dff8ff;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,.9),
    rgba(180,230,255,.8)
  );
  box-shadow:
    0 0 0 2px rgba(0,140,255,.6),
    0 18px 36px rgba(0,0,0,.55);
  animation:fadeIn .32s ease-out;
}

.reader::after {
  content:"";
  position:absolute; inset:0;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,.48),
    rgba(255,255,255,0)
  );
  pointer-events:none;
}

.reader .content {
  font-size: 17px;
  line-height: 1.6;
  color: #00325f;
  text-shadow: 0 1px 0 rgba(255,255,255,.8);
}

/* Anim */
@keyframes fadeIn {
  from { opacity:0; transform:translateY(12px); }
  to { opacity:1; transform:translateY(0); }
}

</style>


</head>
<body>

  <div class="wrap">

    <div id="container" class="grid">

      <div class="card" 
     data-text="Au XVIIᵉ siècle, surtout dans les milieux puritains, le moi devient un terrain d’observation méthodique. L’écriture (journal, mémoires, autobiographies spirituelles) sert à : surveiller son âme, traquer le péché, analyser ses pensées. \n En Amérique, les colons puritains se considèrent comme un peuple élu. Le journal devient : un instrument collectif de vigilance, un outil pour maintenir la pureté morale, un moyen d’interpréter les événements comme signes divins. \n Samuel Pepys (1633–1703) était un haut fonctionnaire de la marine anglaise sous Charles II. Entre 1660 et 1669, il tient un journal intime devenu l’un des plus célèbres de l’histoire anglaise. Contrairement aux Puritains qui écrivaient pour surveiller leur salut, Pepys note tout : ses ambitions professionnelles, ses infidélités, ses plaisirs, ses émotions quotidiennes, ainsi que des événements majeurs comme le Grand Incendie de Londres. Charles II d’Angleterre se pesait plusieurs fois par jour pour observer les variations de son corps selon les activités : avant et après avoir dormi, joué au tennis, dîné, ou monté à cheval. Il constatait par exemple qu’il perdait environ deux livres après une partie de tennis, avant de regagner ce poids en buvant deux verres de liquide.\n \n Au XIXᵉ siècle, dans le contexte du romantisme et de la montée de l’individualisme bourgeois, le journal intime devient un véritable laboratoire de la subjectivité : il accompagne la construction d’une identité personnelle, notamment chez les femmes et les adolescents, pour qui il constitue un espace privé d’expression dans des sociétés encore fortement normées.\n \n Au XXe siècle les deux guerres mondiales favorisent une massification de l’écriture diariste. Le journal intime devient un outil de survie symbolique face à la violence historique, comme l’illustre le témoignage d’Anne Frank, dont le texte, publié après 1947, confère au genre une portée universelle. Le développement de la psychanalyse et des sciences humaines renforce l’intérêt pour l’exploration du moi. À partir des années 1950–1970, le journal sort du cercle des écrivains et intellectuels : les psychologues et spécialistes du développement personnel popularisent le journal thérapeutique. \n \n A l'aube du 21ème siècle, des millions de personnes tiennent des journaux personnels. Les blogs apparaissent et se popularisent avant de prendre la forme de réseaux sociaux où ils imposent des enjeux d'apparence. Certains mouvement radicalisent la pratique autobiographique comme le Quantified Self » (QS) est un mouvement né en Californie à la fin des années 2000 autour de l’automesure des individus à l’aide de technologies numériques. Ce mouvement prône la « connaissance de soi par les chiffres ». Le lifelogging devient très populaire dans les années 2000, cela désigne la pratique consistant à enregistrer et archiver de manière systématique des données sur sa propre vie : photos, localisation, rythme cardiaque, communications, activités, etc. Le chercheur Gordon Bell, chez Microsoft, numérise ses emails, ses documents, ses photos, ses conversations. \n \n Pourquoi ?\n -> Sortir de ses boucles\n -> Se libérer du devoir de mémoire\n -> Garder le fil rouge\n -> Remettre de l'ordre en soi\n \n">
  <img src="D hiver/PalaisIdéal(East_facade)_May_2014.jpg" alt="image 2">
</div>
      
    </div>
  </div>

  <script>
    const container = document.getElementById('container');

    function formatTextLiteral(str){
      if(!str) return '';
      let s = str.replace(/\\n\s*\\n/g, '<br><br>');
      s = s.replace(/\\n/g, '<br>');
      return s;
    }

    container.addEventListener('click', e => {
      const card = e.target.closest('.card');
      if(!card) return;

      const raw = card.getAttribute('data-text') || '';
      const html = formatTextLiteral(raw);

      container.innerHTML = `
        <div class="reader">
          <div class="content">${html}</div>
        </div>
      `;
      document.body.style.background = '#ffffff';
      window.scrollTo({top:0,behavior:'smooth'});
    });
  </script>
</body>
</html>
