<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bibliothèque de synthèses</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1, h2 {
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
    }

    .book {
      background: white;
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.2s;
      text-align: center;
    }

    .book:hover {
      transform: scale(1.05);
    }

    .book img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .slides {
      display: none;
    }

    .slide {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
    }

    button {
      padding: 10px 15px;
      margin-bottom: 20px;
      border: none;
      background: black;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1 id="title">Mes synthèses</h1>

  <div id="library" class="grid"></div>

  <div id="reader" class="slides">
    <button onclick="goBack()">Retour</button>
    <h2 id="bookTitle"></h2>
    <div id="slidesContainer"></div>
  </div>

  <script>
    const books = [
      {
        title: "Livre 1",
        cover: "https://via.placeholder.com/150",
        slides: [
          "Diapo/Classeurs/Diapositive1.PNG",
          "Diapo/Classeurs/Diapositive1.PNG",
          "Conclusion et critique"
        ]
      },
      {
        title: "Livre 2",
        cover: "https://via.placeholder.com/150",
        slides: [
          "Résumé général",
          "Arguments importants",
          "Ouverture"
        ]
      }
    ];

    const library = document.getElementById("library");
    const reader = document.getElementById("reader");
    const slidesContainer = document.getElementById("slidesContainer");
    const bookTitle = document.getElementById("bookTitle");

    function renderLibrary() {
      library.innerHTML = "";
      books.forEach((book, index) => {
        const div = document.createElement("div");
        div.className = "book";
        div.onclick = () => openBook(index);

        div.innerHTML = `
          <img src="${book.cover}" />
          <p>${book.title}</p>
        `;

        library.appendChild(div);
      });
    }

    function openBook(index) {
      const book = books[index];

      library.style.display = "none";
      reader.style.display = "block";

      bookTitle.textContent = book.title;
      slidesContainer.innerHTML = "";

      book.slides.forEach(slide => {
        const div = document.createElement("div");
        div.className = "slide";
        div.textContent = slide;
        slidesContainer.appendChild(div);
      });
    }

    function goBack() {
      reader.style.display = "none";
      library.style.display = "grid";
    }

    renderLibrary();
  </script>

</body>
</html>
