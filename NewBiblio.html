<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Library</title>

<style>
  body {
    margin: 0;
    background: #111;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    padding: 10px;
  }

  .book img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    cursor: pointer;
    transition: 0.2s;
  }

  .book img:hover {
    transform: scale(1.05);
  }

  .viewer {
    display: none;
    padding: 10px;
  }

  .slide {
    width: 100%;
    margin-bottom: 10px;
  }

  .back {
    position: fixed;
    top: 10px;
    left: 10px;
    width: 30px;
    height: 30px;
    background: white;
    opacity: 0.2;
    cursor: pointer;
  }

  .back:hover {
    opacity: 0.6;
  }
</style>
</head>

<body>

<div id="library" class="grid"></div>

<div id="viewer" class="viewer">
  <div class="back" onclick="goBack()"></div>
  <div id="slides"></div>
</div>

<script>
const books = [
  {
    cover: "https://via.placeholder.com/150x200",
    slides: [
      "Diapo/Classeurs/Diapositive1.PNG",
      "Diapo/Classeurs/Diapositive1.PNG",
      "https://via.placeholder.com/800x500"
    ]
  },
  {
    cover: "https://via.placeholder.com/150x200",
    slides: [
      "https://via.placeholder.com/800x500",
      "https://via.placeholder.com/800x500"
    ]
  }
];

const library = document.getElementById("library");
const viewer = document.getElementById("viewer");
const slidesContainer = document.getElementById("slides");

function render() {
  books.forEach((book, i) => {
    const div = document.createElement("div");
    div.className = "book";

    const img = document.createElement("img");
    img.src = book.cover;
    img.onclick = () => openBook(i);

    div.appendChild(img);
    library.appendChild(div);
  });
}

function openBook(i) {
  library.style.display = "none";
  viewer.style.display = "block";

  slidesContainer.innerHTML = "";

  books[i].slides.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.className = "slide";
    slidesContainer.appendChild(img);
  });
}

function goBack() {
  viewer.style.display = "none";
  library.style.display = "grid";
}

// touche ESC pour retour
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") goBack();
});

render();
</script>

</body>
</html>
