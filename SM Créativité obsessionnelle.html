<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frutiger Aero - Galerie</title>

<style>
/* ===== VARIABLES ===== */
:root {
  --gap: 22px;
  --radius: 14px;
  --aero-white: #e8faff;
  --aero-glass: rgba(255,255,255,.55);
  --shadow-dark: 0 8px 22px rgba(0,0,0,.45);
}

/* ===== FOND ===== */
html, body {
  margin: 0;
  height: 100%;
  font-family: "Segoe UI", Tahoma, sans-serif;
  background: radial-gradient(circle at 70% 20%, #bafffc 0%, #5dc8ff 35%, #0074d9 100%);
  background-attachment: fixed;
  color: #002242;
}

.wrap {
  max-width: 1100px;
  margin: auto;
  padding: 40px;
}

/* ===== GRID ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
  gap: var(--gap);
}

/* ===== CARD ===== */
.card {
  border-radius: var(--radius);
  overflow: hidden;
  min-height: 200px;
  cursor: pointer;
  background: linear-gradient(135deg,var(--aero-white),var(--aero-glass));
  box-shadow: var(--shadow-dark);
  transition: .2s ease;
}

.card:hover {
  transform: translateY(-6px) scale(1.03);
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ===== READER ===== */
.reader {
  padding: 40px;
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow-dark);
  animation: fadeIn .3s ease;
}

.content {
  font-size: 17px;
  line-height: 1.6;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="wrap">
  <div id="container" class="grid">

    <div class="card"
      data-text="Ferdinand Cheval était un simple facteur rural de la Drôme, né en 1836 et mort en 1924.\n\nÀ 43 ans, en 1879, il trébuche sur une pierre étrange qui déclenche un rêve ancien.\n\nPendant 33 ans, de 1879 à 1912, il construit seul son Palais Idéal à Hauterives.\n\nNek Chand, inspecteur des routes en Inde, commence dans les années 1950 à collecter des déchets pour créer un immense jardin de sculptures.">
      <img src="Marginal/Internet/Palais Idéal.jpg" alt="Palais Idéal">
    </div>


      <div class="card"
      data-text="Ferdinand Cheval était un simple facteur rural de la Drôme, né en 1836 et mort en 1924.\n\nÀ 43 ans, en 1879, il trébuche sur une pierre étrange qui déclenche un rêve ancien.\n\nPendant 33 ans, de 1879 à 1912, il construit seul son Palais Idéal à Hauterives.\n\nNek Chand, inspecteur des routes en Inde, commence dans les années 1950 à collecter des déchets pour créer un immense jardin de sculptures.">
      <img src="Marginal/Internet/Palais Idéal.jpg" alt="Palais Idéal">
    </div>

  </div>
</div>

<script>
const container = document.getElementById("container");

function formatText(str){
  return str
    .replace(/\\n\\n/g,"<br><br>")
    .replace(/\\n/g,"<br>");
}

container.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if(!card) return;

  const html = formatText(card.dataset.text);

  container.innerHTML = `
    <div class="reader">
      <div class="content">${html}</div>
    </div>
  `;

  window.scrollTo({top:0,behavior:"smooth"});
});
</script>

</body>
</html>
