<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM Créativité obsessionnelle.html</title>

<style>
/* ===== VARIABLES ===== */
:root {
  --gap: 22px;
  --radius: 14px;
  --aero-white: #e8faff;
  --aero-glass: rgba(255,255,255,.55);
  --shadow-dark: 0 8px 22px rgba(0,0,0,.45);
}

/* ===== FOND ===== */
html, body {
  margin: 0;
  height: 100%;
  font-family: "Segoe UI", Tahoma, sans-serif;
  background: radial-gradient(circle at 70% 20%, #bafffc 0%, #5dc8ff 35%, #0074d9 100%);
  background-attachment: fixed;
  color: #002242;
}

.wrap {
  max-width: 1100px;
  margin: auto;
  padding: 40px;
}

/* ===== GRID ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
  gap: var(--gap);
}

/* ===== CARD ===== */
.card {
  border-radius: var(--radius);
  overflow: hidden;
  min-height: 200px;
  cursor: pointer;
  background: linear-gradient(135deg,var(--aero-white),var(--aero-glass));
  box-shadow: var(--shadow-dark);
  transition: .2s ease;
}

.card:hover {
  transform: translateY(-6px) scale(1.03);
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ===== READER ===== */
.reader {
  padding: 40px;
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow-dark);
  animation: fadeIn .3s ease;
}

.content {
  font-size: 17px;
  line-height: 1.6;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="wrap">
  <div id="container" class="grid">

    <div class="card"
      data-text=
      "Origines et vie quotidienne\n \n Ferdinand Cheval naît le 19 avril 1836 dans le village de Charmes-sur-l'Herbasse, dans une famille paysanne modeste. Sa vie est marquée très tôt par la difficulté : il perd plusieurs membres de sa famille et reçoit peu d’éducation formelle.\n \n À l’âge adulte, il devient facteur rural. Chaque jour, il parcourt à pied plus de 30 kilomètres pour distribuer le courrier dans la campagne autour de Hauterives. Ce travail solitaire, répété pendant des années, structure toute son existence.\n \n La pierre qui déclenche un rêve\n \n En 1879, alors qu’il effectue sa tournée, Cheval trébuche sur une pierre à la forme étrange. Fasciné par cette pierre sculptée par la nature, il la ramasse. Ce moment devient pour lui une révélation.\n \n Il commence alors à imaginer un palais fantastique, inspiré de la nature, de temples lointains, d’animaux et de paysages imaginaires. Chaque jour, durant sa tournée, il ramasse des pierres qu’il transporte dans ses poches ou dans une brouette.\n \n À partir de 1879, Cheval entreprend seul la construction de son œuvre, qu’il appellera le Palais Idéal du Facteur Cheval.\n \n Pendant 33 ans, il travaille la nuit après sa tournée de facteur. Sans formation d’architecte ni d’artiste, il construit un monument mêlant :\n \n temples hindous imaginaires\n châteaux médiévaux\n grottes naturelles\n sculptures d’animaux et de figures mythologiques\n \n Il utilise simplement pierres, chaux et ciment, assemblés à la main.\n \n Le palais mesure environ 26 mètres de long et 12 mètres de haut. Sur les murs, il grave de nombreuses phrases reflétant son obstination et ses rêves.\n \n Une œuvre d’imagination pure\n \n Le Palais Idéal est aujourd’hui considéré comme un chef-d’œuvre d’art naïf et d’architecture outsider. L’œuvre fascine de nombreux artistes, notamment les surréalistes au XXᵉ siècle.\n \n En 1969, le monument est officiellement classé monument historique en France.\n \n Fin de sa vie\n \n Ferdinand Cheval termine son palais en 1912. Comme la loi lui interdit d’être enterré dans son œuvre, il construit ensuite son propre tombeau au cimetière de Hauterives, appelé Tombeau du Facteur Cheval.\n \n Il meurt en 1924, à l’âge de 88 ans.">
      <img src="Marginal/Internet/Palais Idéal.jpg" alt="Palais Idéal">
    </div>

        <div class="card"
      data-text="Adolf Wölfli naît en 1864 en Suisse dans une famille extrêmement pauvre. Son père est violent, alcoolique et souvent absent, sa mère meurt tôt, et il est placé très jeune chez différents paysans. Il subit la faim, les coups, le travail forcé et l’abandon affectif. À l’adolescence et à l’âge adulte, il enchaîne des petits emplois agricoles ou manuels, sans stabilité. Il développe aussi des comportements problématiques et commet des délits, notamment à caractère sexuel, ce qui conduit à son arrestation puis à son internement en 1895 à l’asile psychiatrique de Waldau, près de Berne, où il restera jusqu’à sa mort en 1930.\n \n C’est uniquement après son internement que son activité artistique commence réellement. À partir de 1899, il produit sans interruption pendant plus de 30 ans une quantité énorme de travaux. Concrètement, il remplit des cahiers entiers de textes écrits à la main, souvent sur du papier de récupération, et les accompagne de dessins, de collages et même de notations musicales. Son œuvre totale représente plus de 25 000 pages organisées en dizaines de volumes. Il fabrique lui-même ses « livres » en assemblant des feuilles, en les cousant et en les couvrant de cartons. Il écrit au crayon ou en couleur, avec une orthographe personnelle mais constante.\n \n Son œuvre suit une évolution très claire. Au début, il écrit une sorte d’autobiographie, mais elle est rapidement transformée. Il ne raconte pas simplement sa vie réelle : il la réinvente. Concrètement, il se met en scène sous forme d’un enfant appelé « Doufi », qui devient le héros d’aventures extraordinaires. Par exemple, au lieu de rester dans le cadre de la Suisse rurale, il imagine que cet enfant voyage à travers le monde entier. Il traverse des pays, rencontre des personnages inventés ou historiques, comme des princesses ou des rois, et participe à des expéditions. Un passage précis montre comment il mêle réalité et fiction : il part d’un souvenir réel (son enfance) puis imagine une émigration en Amérique, un retour en Europe, et des voyages à travers l’Espagne avec des compagnons fictifs. Il traverse des continents, rencontre des rois, invente des événements. Ensuite, il passe à une phase où il « achète » symboliquement des territoires entiers et construit un monde imaginaire qu’il organise lui-même. Il donne des noms, crée des villes, des institutions, des systèmes économiques.\n \n À un stade plus avancé, il ne se contente plus d’inventer un monde : il se transforme lui-même. Il devient une figure centrale, presque divine, appelée « Saint Adolf ». Dans ses écrits, il crée une sorte de système total où tout est relié : géographie, histoire, économie, religion. Puis son travail évolue encore vers des compositions musicales. Il écrit des séries de chants, de marches, de danses (polkas, mazurkas), avec des structures très répétitives et organisées par des chiffres. La fin de son œuvre est marquée par une grande composition appelée « Trauermarsch » (marche funèbre), très structurée et abstraite.\n \n Les dessins occupent une place essentielle et sont intégrés directement dans les textes. Ils ne sont pas séparés : ils traversent les pages, entourent les mots, remplissent les marges. Concrètement, il dessine des personnages, souvent avec des symboles répétitifs, des bâtiments, des villes, des paysages, mais aussi des formes très complexes, presque géométriques ou décoratives. Il utilise aussi des images découpées (collages). Ses dessins représentent souvent des scènes précises : des voyages, des catastrophes, des sauvetages, des cérémonies, ou des constructions imaginaires. On retrouve aussi des motifs récurrents comme des architectures massives, des cartes géographiques transformées, ou des compositions symétriques très détaillées.\n \n  Il numérote ses pages, structure ses volumes, donne des titres, date ses écrits. Il construit un système cohérent avec des règles internes. Ce n’est pas une production désordonnée : c’est un univers complet qu’il développe méthodiquement pendant des années.\n \n Sur le plan psychologique, cette œuvre est directement liée à sa maladie mentale, notamment la schizophrénie. Concrètement, il utilise la création pour transformer son vécu : les traumatismes de son enfance, la violence subie, l’exclusion sociale. Il reconstruit un monde où il a du pouvoir, où il contrôle tout, où il peut donner un sens à ce qu’il a vécu. L’écriture et le dessin deviennent pour lui une activité quotidienne essentielle, presque une nécessité.\n \n Au départ, c’est son psychiatre, Walter Morgenthaler, qui comprend qu’il ne s’agit pas seulement d’un malade mais d’un véritable créateur. Plus tard, des artistes et critiques s’y intéressent. Son œuvre est exposée, étudiée, et devient un exemple majeur de ce qu’on appelle aujourd’hui l’art brut. Des écrivains et artistes importants voient en lui une figure essentielle pour comprendre la créativité en dehors des normes traditionnelles.">
          <img src="Marginal/Internet/Adolf Wölfli.jpg" alt="Palais Idéal">
    </div>
    
  </div>
</div>

<script>
const container = document.getElementById("container");

function formatText(str){
  return str
    .replace(/\\n\\n/g,"<br><br>")
    .replace(/\\n/g,"<br>");
}

container.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if(!card) return;

  const html = formatText(card.dataset.text);

  container.innerHTML = `
    <div class="reader">
      <div class="content">${html}</div>
    </div>
  `;

  window.scrollTo({top:0,behavior:"smooth"});
});
</script>

</body>
</html>
