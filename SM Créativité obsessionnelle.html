<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frutiger Aero - Galerie</title>

<style>
/* ===== VARIABLES ===== */
:root {
  --gap: 22px;
  --radius: 14px;
  --aero-white: #e8faff;
  --aero-glass: rgba(255,255,255,.55);
  --shadow-dark: 0 8px 22px rgba(0,0,0,.45);
}

/* ===== FOND ===== */
html, body {
  margin: 0;
  height: 100%;
  font-family: "Segoe UI", Tahoma, sans-serif;
  background: radial-gradient(circle at 70% 20%, #bafffc 0%, #5dc8ff 35%, #0074d9 100%);
  background-attachment: fixed;
  color: #002242;
}

.wrap {
  max-width: 1100px;
  margin: auto;
  padding: 40px;
}

/* ===== GRID ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
  gap: var(--gap);
}

/* ===== CARD ===== */
.card {
  border-radius: var(--radius);
  overflow: hidden;
  min-height: 200px;
  cursor: pointer;
  background: linear-gradient(135deg,var(--aero-white),var(--aero-glass));
  box-shadow: var(--shadow-dark);
  transition: .2s ease;
}

.card:hover {
  transform: translateY(-6px) scale(1.03);
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ===== READER ===== */
.reader {
  padding: 40px;
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow-dark);
  animation: fadeIn .3s ease;
}

.content {
  font-size: 17px;
  line-height: 1.6;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="wrap">
  <div id="container" class="grid">

    <div class="card"
      data-text=
      "Origines et vie quotidienne\n \n Ferdinand Cheval naît le 19 avril 1836 dans le village de Charmes-sur-l'Herbasse, dans une famille paysanne modeste. Sa vie est marquée très tôt par la difficulté : il perd plusieurs membres de sa famille et reçoit peu d’éducation formelle.\n \n À l’âge adulte, il devient facteur rural. Chaque jour, il parcourt à pied plus de 30 kilomètres pour distribuer le courrier dans la campagne autour de Hauterives. Ce travail solitaire, répété pendant des années, structure toute son existence.\n \n La pierre qui déclenche un rêve\n \n En 1879, alors qu’il effectue sa tournée, Cheval trébuche sur une pierre à la forme étrange. Fasciné par cette pierre sculptée par la nature, il la ramasse. Ce moment devient pour lui une révélation.\n \n Il commence alors à imaginer un palais fantastique, inspiré de la nature, de temples lointains, d’animaux et de paysages imaginaires. Chaque jour, durant sa tournée, il ramasse des pierres qu’il transporte dans ses poches ou dans une brouette.\n \n À partir de 1879, Cheval entreprend seul la construction de son œuvre, qu’il appellera le Palais Idéal du Facteur Cheval.\n \n Pendant 33 ans, il travaille la nuit après sa tournée de facteur. Sans formation d’architecte ni d’artiste, il construit un monument mêlant :\n \n temples hindous imaginaires\n châteaux médiévaux\n grottes naturelles\n sculptures d’animaux et de figures mythologiques\n \n Il utilise simplement pierres, chaux et ciment, assemblés à la main.\n \n Le palais mesure environ 26 mètres de long et 12 mètres de haut. Sur les murs, il grave de nombreuses phrases reflétant son obstination et ses rêves.\n \n Une œuvre d’imagination pure\n \n Le Palais Idéal est aujourd’hui considéré comme un chef-d’œuvre d’art naïf et d’architecture outsider. L’œuvre fascine de nombreux artistes, notamment les surréalistes au XXᵉ siècle.\n \n En 1969, le monument est officiellement classé monument historique en France.\n \n Fin de sa vie\n \n Ferdinand Cheval termine son palais en 1912. Comme la loi lui interdit d’être enterré dans son œuvre, il construit ensuite son propre tombeau au cimetière de Hauterives, appelé Tombeau du Facteur Cheval.\n \n Il meurt en 1924, à l’âge de 88 ans.">
      <img src="Marginal/Internet/Palais Idéal.jpg" alt="Palais Idéal">
    </div>

  </div>
</div>

<script>
const container = document.getElementById("container");

function formatText(str){
  return str
    .replace(/\\n\\n/g,"<br><br>")
    .replace(/\\n/g,"<br>");
}

container.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if(!card) return;

  const html = formatText(card.dataset.text);

  container.innerHTML = `
    <div class="reader">
      <div class="content">${html}</div>
    </div>
  `;

  window.scrollTo({top:0,behavior:"smooth"});
});
</script>

</body>
</html>
