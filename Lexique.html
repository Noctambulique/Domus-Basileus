<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Basile Words</title>

  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      font-family: 'Playfair Display', serif;
    }

    .title {
      margin-top: 40px;
      font-size: 64px;

      letter-spacing: 3px;
    }

    .container {
      margin-top: 60px;
      text-align: center;
    }

    .word {
      font-size: 48px;
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <!-- Titre -->
  <div class="title">Les Mots de Basile</div>

  <!-- Mots (faciles à modifier ici) -->
  <div class="container">
    <div class="word">Pouvoir</div>
    <div class="word">Silence</div>
    <div class="word">Vision</div>
    <div class="word">Contrôle</div>
  </div>

</html>
