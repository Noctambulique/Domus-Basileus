<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>État intérieur</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: serif;
    margin: 0;
    background-image: url("Fond/Fille devant maison.jpg");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center top;
    background-attachment: fixed;
}

/* PANNEAU PRINCIPAL */
.panel {
    max-width: 720px;
    margin: 80px auto;
    padding: 50px 60px;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(8px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.15);
}

/* TITRE */
h1 {
    font-weight: normal;
    margin-bottom: 30px;
    letter-spacing: 1px;
}

/* GRAPH */
canvas {
    max-width: 100%;
    margin: 30px auto 20px;
}

/* BOUTONS */
.buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-top: 40px;
}

button {
    height: 52px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.2);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.25s ease;
    backdrop-filter: blur(4px);
    color: #ffffff;
}

button:hover {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.6);
    transform: translateY(-2px);
}
</style>
</head>


<h1>État intérieur</h1>

<canvas id="radarChart" height="450"></canvas>

<div class="buttons">
    <button data-criterion="Sommeil"></button>
    <button data-criterion="Nourriture"></button>
    <button data-criterion="Sociabilité"></button>
    <button data-criterion="Sortir"></button>
    <button data-criterion="Imprévu"></button>
    <button data-criterion="Temps"></button>
    <button data-criterion="Problème"></button>
    <button data-criterion="Musique"></button>
    <button data-criterion="Réel"></button>
    <button data-criterion="Film"></button>
</div>
</div>

<script>


</body>

<div class="panel">


<script>
/* 🔢 BASE */
const baseBars = {
    adequation: 50,
    resilience: 50,
    motivation: 50,
    clarte: 50,
    inspiration: 50
};

let bars = { ...baseBars };

/* ⚙️ CONFIG */
const criteriaConfig = {
    Sommeil:{defaultState:1,states:[
        {label:"🛏️ Mauvais sommeil",impact:{adequation:-10,resilience:-20,motivation:-15,clarte:-15, inspiration:-10}},
        {label:"🛏️ Sommeil moyen",impact:{}},
        {label:"🛏️ Bon sommeil",impact:{adequation:10,resilience:10,motivation:10,clarte:10}}
    ]},
    Nourriture:{defaultState:1,states:[
        {label:"🥗 Mauvaise alimentation",impact:{adequation:-10,resilience:-5,motivation:-10,clarte:-5}},
        {label:"🥗 Alimentation correcte",impact:{}},
        {label:"🥗 Bonne alimentation",impact:{adequation:5,resilience:5,motivation:5,clarte:10}}
    ]},
    Sociabilité:{defaultState:1,states:[
        {label:"🗣️ Isolement",impact:{adequation:-10,resilience:-10,motivation:-10,clarte:-5}},
        {label:"🗣️ Contacts normaux",impact:{}},
        {label:"🗣️ Lien social nourrissant",impact:{adequation:15,resilience:10,motivation:10,clarte:5}}
    ]},
    Sortir:{defaultState:1,states:[
        {label:"🚶 Immobilité",impact:{adequation:-10,resilience:-10,motivation:-20,clarte:-15}},
        {label:"🚶 En mouvement",impact:{}},
        {label:"🚶 Haut dynamisme",impact:{adequation:15,resilience:15,motivation:15,clarte:10,inspiration:10}}
    ]},
    Imprévu:{defaultState:1,states:[
        {label:"🗺️ Imprévu",impact:{adequation:-10,resilience:-20,motivation:-20}},
        {label:"🗺️ Rien de prévu",impact:{}},
        {label:"🗺️ Plan fluide",impact:{adequation:15,resilience:5,motivation:5,clarte:10}}
    ]},
    Temps:{defaultState:1,states:[
        {label:"⏳ Pas de temps",impact:{adequation:-15,resilience:-10,clarte:-5,inspiration:-10}},
        {label:"⏳ Un peu de temps",impact:{}},
        {label:"⏳ Beaucoup de temps",impact:{adequation:5,resilience:5,motivation:5,clarte:10,inspiration:5}}
    ]},
    Problème:{defaultState:1,states:[
        {label:"❓ Problème irrésolu",impact:{adequation:-15,resilience:-20,clarte:-10}},
        {label:"❓ En recherche",impact:{}},
        {label:"❓ Compris",impact:{adequation:15,resilience:15,clarte:10}}
    ]},
    Musique:{defaultState:1,states:[
        {label:"🎵 Pas de musique",impact:{}},
        {label:"🎵 Un peu de musique",impact:{}},
        {label:"🎵 Beaucoup de musique",impact:{adequation:15,resilience:15,motivation:15,clarte:5,inspiration:20}}
    ]},
    Réel:{defaultState:1,states:[
        {label:"📞 Pas de réel",impact:{adequation:10}},
        {label:"📞 Un peu de réel",impact:{}},
        {label:"📞 Beaucoup de réel",impact:{adequation:-5,resilience:20,motivation:-10,clarte:-10}}
    ]},
    Film:{defaultState:1,states:[
        {label:"🎬 Aucun film",impact:{}},
        {label:"🎬 Un épisode",impact:{}},
        {label:"🎬 Beaucoup",impact:{adequation:-5,resilience:10,motivation:-10,clarte:-10,inspiration:10}}
    ]}
};

const activeStates = {};

/* Clamp */
const clamp = v => Math.max(0, Math.min(100, v));

/* Radar */
const ctx = document.getElementById("radarChart");

const radarChart = new Chart(ctx, {
    type: "radar",
    data: {
        labels: ["Adéquation", "Résilience", "Motivation", "Clarté", "Inspiration"],
        datasets: [{
            data: Object.values(baseBars),
            backgroundColor: "rgba(110,125,255,0.25)",
            borderColor: "rgba(110,125,255,0.8)",
            pointBackgroundColor: "#6f7cff"
        }]
    },
    options: {
        scales: {
            r: {
                min: 0,
                max: 100,
                ticks: { display: false },
                grid: { color: "rgba(0,0,0,0.15)" },
                angleLines: { color: "rgba(0,0,0,0.15)" }
            }
        },
        plugins: {
            legend: { display: false }
        }
    }
});

/* Recalcul */
function recomputeBars() {
    bars = { ...baseBars };

    for (const c in activeStates) {
        const impact = activeStates[c];
        for (const key in impact) {
            bars[key] += impact[key];
        }
    }

    for (const k in bars) bars[k] = clamp(bars[k]);

    radarChart.data.datasets[0].data = [
        bars.adequation,
        bars.resilience,
        bars.motivation,
        bars.clarte,
        bars.inspiration
    ];

    radarChart.update();
}

/* Boutons */
document.querySelectorAll("[data-criterion]").forEach(btn => {
    const id = btn.dataset.criterion;
    const cfg = criteriaConfig[id];
    let index = cfg.defaultState;

    btn.textContent = cfg.states[index].label;
    activeStates[id] = cfg.states[index].impact;

    btn.addEventListener("click", () => {
        index = (index + 1) % cfg.states.length;
        btn.textContent = cfg.states[index].label;
        activeStates[id] = cfg.states[index].impact;
        recomputeBars();
    });
});

/* Init */
recomputeBars();
</script>

</body>
</html>
