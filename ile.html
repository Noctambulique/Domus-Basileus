<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Map interactive</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #map-container {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        cursor: grab;
        position: relative;
        background: #000;
    }

    #map {
        position: absolute;
        top: 0;
        left: 0;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
    }

    .marker {
        position: absolute;
        cursor: pointer;
    }
</style>
</head>

<body>

<div id="map-container">
    <img id="map" src="Fond/Map Ile.png" alt="map">
</div>

<script>
const map = document.getElementById("map");
const container = document.getElementById("map-container");

let isDragging = false;
let startX, startY;
let mapX = 0, mapY = 0;

/* --- Limites de déplacement --- */
function clampMapPosition(x, y) {
    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;
    const mapWidth = map.offsetWidth;
    const mapHeight = map.offsetHeight;

    const minX = Math.min(0, containerWidth - mapWidth);
    const minY = Math.min(0, containerHeight - mapHeight);

    return {
        x: Math.min(0, Math.max(minX, x)),
        y: Math.min(0, Math.max(minY, y))
    };
}

/* --- Mise à jour visuelle --- */
function updateMapPosition() {
    map.style.transform = `translate(${mapX}px, ${mapY}px)`;
    document.querySelectorAll(".marker").forEach(marker => {
        marker.style.transform = `translate(${mapX}px, ${mapY}px)`;
    });
}

/* --- Déplacement de la map --- */
container.addEventListener("mousedown", e => {
    isDragging = true;
    startX = e.clientX - mapX;
    startY = e.clientY - mapY;
    container.style.cursor = "grabbing";
});

window.addEventListener("mouseup", () => {
    isDragging = false;
    container.style.cursor = "grab";
});

window.addEventListener("mousemove", e => {
    if (isDragging) {
        const newX = e.clientX - startX;
        const newY = e.clientY - startY;

        const clamped = clampMapPosition(newX, newY);
        mapX = clamped.x;
        mapY = clamped.y;

        updateMapPosition();
    }
});

/* --- Ajouter un marker --- */
function addMarker(x, y, size, image, link) {
    const marker = document.createElement("img");
    marker.src = image;
    marker.className = "marker";
    marker.style.width = size + "px";
    marker.style.left = x + "px";
    marker.style.top = y + "px";
    marker.style.transform = `translate(${mapX}px, ${mapY}px)`;

    marker.addEventListener("click", () => {
        window.location.href = link;
    });

    container.appendChild(marker);
}

/* --- Recalage au chargement --- */
map.addEventListener("load", () => {
    const clamped = clampMapPosition(mapX, mapY);
    mapX = clamped.x;
    mapY = clamped.y;
    updateMapPosition();
});

/* --- Recalage au resize --- */
window.addEventListener("resize", () => {
    const clamped = clampMapPosition(mapX, mapY);
    mapX = clamped.x;
    mapY = clamped.y;
    updateMapPosition();
});

/* --- Exemples --- */

</script>

</body>
</html>
