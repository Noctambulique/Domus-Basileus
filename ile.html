<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Ile</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    body {
        touch-action: none;
    }

    #map-container {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        cursor: grab;
        position: relative;
        background: #000;
        touch-action: none;
    }

    #map {
        position: absolute;
        top: 0;
        left: 0;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
        max-width: none;
    }

    .marker {
        position: absolute;
        cursor: pointer;
        user-select: none;
        -webkit-user-drag: none;
    }
</style>
</head>

<body>

<div id="map-container">
    <img id="map" src="Fond/Map Ile.png" alt="map">
</div>

<script>
const map = document.getElementById("map");
const container = document.getElementById("map-container");

let isDragging = false;
let startX = 0, startY = 0;
let mapX = 0, mapY = 0;

/* --- Limites de déplacement --- */
function clampMapPosition(x, y) {
    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;
    const mapWidth = map.offsetWidth;
    const mapHeight = map.offsetHeight;

    const minX = Math.min(0, containerWidth - mapWidth);
    const minY = Math.min(0, containerHeight - mapHeight);

    return {
        x: Math.min(0, Math.max(minX, x)),
        y: Math.min(0, Math.max(minY, y))
    };
}

/* --- Centrage initial de la map --- */
function centerMap() {
    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;
    const mapWidth = map.offsetWidth;
    const mapHeight = map.offsetHeight;

    let centeredX = (containerWidth - mapWidth) / 2;
    let centeredY = (containerHeight - mapHeight) / 2;

    const clamped = clampMapPosition(centeredX, centeredY);
    mapX = clamped.x;
    mapY = clamped.y;

    updateMapPosition();
}

/* --- Mise à jour visuelle --- */
function updateMapPosition() {
    map.style.transform = `translate(${mapX}px, ${mapY}px)`;

    document.querySelectorAll(".marker").forEach(marker => {
        marker.style.transform = `translate(${mapX}px, ${mapY}px)`;
    });
}

/* --- Début du drag --- */
container.addEventListener("pointerdown", e => {
    isDragging = true;
    startX = e.clientX - mapX;
    startY = e.clientY - mapY;
    container.style.cursor = "grabbing";
    container.setPointerCapture(e.pointerId);
});

/* --- Fin du drag --- */
container.addEventListener("pointerup", e => {
    isDragging = false;
    container.style.cursor = "grab";
    container.releasePointerCapture(e.pointerId);
});

container.addEventListener("pointercancel", e => {
    isDragging = false;
    container.style.cursor = "grab";
});

/* --- Déplacement de la map --- */
container.addEventListener("pointermove", e => {
    if (!isDragging) return;

    const newX = e.clientX - startX;
    const newY = e.clientY - startY;

    const clamped = clampMapPosition(newX, newY);
    mapX = clamped.x;
    mapY = clamped.y;

    updateMapPosition();
});

/* --- Ajouter un marker --- */
function addMarker(x, y, size, image, link) {
    const marker = document.createElement("img");
    marker.src = image;
    marker.className = "marker";
    marker.style.width = size + "px";
    marker.style.left = x + "px";
    marker.style.top = y + "px";
    marker.style.transform = `translate(${mapX}px, ${mapY}px)`;

    marker.addEventListener("click", () => {
        window.location.href = link;
    });

    container.appendChild(marker);
}

/* --- Chargement --- */
map.addEventListener("load", () => {
    centerMap();
});

/* --- Resize : recentrer proprement --- */
window.addEventListener("resize", () => {
    centerMap();
});

/* --- Exemples --- */
addMarker(645, 160, 110, "Fond/Excel Art.png", "ExcelArt.html");
addMarker(810, 635, 140, "Fond/ImmeubleCulture.png", "Lubies.html");
</script>

</body>
</html>
