<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basilegram — Profil</title>
  <style>
    :root {
      --bg: #090909;
      --panel: #111111;
      --panel-soft: #151515;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f5;
      --muted: #9b9b9b;
      --soft: #d8d8d8;
      --overlay: rgba(0, 0, 0, 0.62);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .brand {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.04em;
      margin-bottom: 28px;
    }

    .profile-header {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 28px;
      align-items: center;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-main {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .profile-top {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      align-items: center;
    }

    .username {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      color: var(--soft);
      font-size: 15px;
    }

    .meta strong {
      color: white;
      margin-right: 6px;
    }

    .meta-link {
      color: var(--soft);
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    .meta-link:hover {
      color: white;
      opacity: 1;
    }

    .bio {
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bio-name {
      font-size: 15px;
      font-weight: 600;
    }

    .bio-text,
    .bio-link {
      font-size: 14px;
      line-height: 1.7;
      color: var(--soft);
    }

    .bio-link {
      color: #b9d3ff;
    }

    .gallery-section {
      padding-top: 28px;
    }

    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: var(--soft);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--panel-soft);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .gallery-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      opacity: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-size: 14px;
      color: white;
      transition: opacity 0.25s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
      opacity: 0.92;
    }

    .gallery-item:hover .gallery-overlay {
      opacity: 1;
    }

    .footer-note {
      margin-top: 26px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--overlay);
      padding: 20px;
      z-index: 50;
    }

    .modal.is-open {
      display: flex;
    }

    .modal-panel {
      width: min(440px, 100%);
      max-height: 75vh;
      overflow: auto;
      background: #101010;
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: #101010;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
      color: white;
    }

    .modal-close {
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .modal-close:hover {
      color: white;
    }

    .following-list {
      display: flex;
      flex-direction: column;
      padding: 8px;
    }

    .following-card {
      background: transparent;
      border-radius: 18px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .following-card:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .following-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .following-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--panel-soft);
      flex-shrink: 0;
    }

    .following-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .following-info {
      min-width: 0;
    }

    .following-name {
      font-size: 14px;
      font-weight: 600;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .following-handle {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }

    .following-tag {
      font-size: 12px;
      color: var(--soft);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 10px;
      flex-shrink: 0;
    }

    @media (max-width: 760px) {
      .page {
        padding: 24px 14px 40px;
      }

      .profile-header {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .avatar {
        width: 92px;
        height: 92px;
      }

      .username {
        font-size: 22px;
      }

      .gallery-grid {
        gap: 4px;
      }

      .modal-panel {
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <script>
    const profileData = {
      siteName: 'Basilegram',
      username: 'basile',
      displayName: 'Basile',
      avatar: 'Marginal/Basilegram/Paris.webp',
      postsCount: 2,
      followersCount: 2,
      followingCount: 2,
      followingLabel: 'Suivi',
      following: [
{
  name: 'Octavie',
  handle: '@Octavie',
  avatar: 'Marginal/Basilegram/Hibiscus Emoji.jpg'
},
{
  name: 'Bellatrix',
  handle: '@Bellatrix',
  avatar: 'Marginal/Basilegram/Cerisier Emoji.jpg'
}
      ],
  posts: [
  { image: 'Marginal/Basilegram/Visage.jpeg', likes: 2, comments: 2 },
    { image: 'Marginal/Basilegram/Paris.webp', likes: 2, comments: 2 },
      ]
    };
  </script>

  <div class="page">
    <div class="brand" id="brand"></div>

    <section class="profile-header">
      <div class="avatar">
        <img id="profile-avatar" src="" alt="Avatar profil">
      </div>

      <div class="profile-main">
        <div class="profile-top">
          <div class="username" id="username"></div>
        </div>

        <div class="meta">
          <span><strong id="posts-count"></strong>publications</span>
          <span><strong id="followers-count"></strong>abonnés</span>
          <button class="meta-link" id="following-trigger" type="button" aria-haspopup="dialog" aria-controls="following-modal" aria-expanded="false">
            <strong id="following-count"></strong>suivis
          </button>
        </div>

        <div class="bio">
          <div class="bio-name" id="display-name"></div>
          <div class="bio-text" id="bio-text"></div>
          <a class="bio-link" id="bio-link" href="#"></a>
        </div>
      </div>
    </section>

    <section class="gallery-section">
      <div class="gallery-header">Publications</div>
      <div class="gallery-grid" id="gallery-grid"></div>
      </div>
    </section>
  </div>

  <div class="modal" id="following-modal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="following-modal-title">
      <div class="modal-header">
        <div class="modal-title" id="following-modal-title">Comptes suivis</div>
        <button class="modal-close" id="following-close" type="button" aria-label="Fermer">×</button>
      </div>
      <div class="following-list" id="following-list"></div>
    </div>
  </div>

  <script>
    document.getElementById('brand').textContent = profileData.siteName;
    document.getElementById('profile-avatar').src = profileData.avatar;
    document.getElementById('username').textContent = profileData.username;
    document.getElementById('posts-count').textContent = profileData.postsCount;
    document.getElementById('followers-count').textContent = profileData.followersCount;
    document.getElementById('following-count').textContent = profileData.followingCount;
    document.getElementById('display-name').textContent = profileData.displayName;
    document.getElementById('bio-text').textContent = profileData.bioText;
    document.getElementById('bio-link').textContent = profileData.bioLink;

    const followingList = document.getElementById('following-list');
    profileData.following.forEach((account) => {
      const card = document.createElement('div');
      card.className = 'following-card';
      card.innerHTML = `
        <div class="following-left">
          <div class="following-avatar">
            <img src="${account.avatar}" alt="${account.name}">
          </div>
          <div class="following-info">
            <div class="following-name">${account.name}</div>
            <div class="following-handle">${account.handle}</div>
          </div>
        </div>
        <div class="following-tag">${profileData.followingLabel}</div>
      `;
      followingList.appendChild(card);
    });

    const galleryGrid = document.getElementById('gallery-grid');
    profileData.posts.forEach((post, index) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML = `
        <img src="${post.image}" alt="Publication ${index + 1}">
        <div class="gallery-overlay">
          <span>♡ ${post.likes}</span>
          <span>◦ ${post.comments}</span>
        </div>
      `;
      galleryGrid.appendChild(item);
    });

    const modal = document.getElementById('following-modal');
    const trigger = document.getElementById('following-trigger');
    const closeButton = document.getElementById('following-close');

    function openModal() {
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      trigger.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden', 'true');
      trigger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

    trigger.addEventListener('click', openModal);
    closeButton.addEventListener('click', closeModal);

    modal.addEventListener('click', (event) => {
      if (event.target === modal) {
        closeModal();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && modal.classList.contains('is-open')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
