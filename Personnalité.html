<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test</title>
  <style>
    :root {
      --text: #161616;
      --muted: #666;
      --line: rgba(0, 0, 0, 0.08);
      --panel: rgba(255, 255, 255, 0.84);
      --panel-strong: rgba(255, 255, 255, 0.94);
      --accent: #111;
      --radius: 18px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background-color: #ece8e1;
      background-image: var(--bg-image, none);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.34);
      backdrop-filter: blur(2px);
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(860px, calc(100% - 28px));
      margin: 28px auto 56px;
    }

    .hero {
      margin-bottom: 18px;
    }

    .hero img {
      display: block;
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      background: var(--panel-strong);
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: white;
    }

    .questions {
      display: grid;
      gap: 10px;
    }

    .question {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      cursor: pointer;
      user-select: none;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }

    .question:hover {
      transform: translateY(-1px);
      background: var(--panel-strong);
    }

    .question.selected {
      border-color: rgba(0, 0, 0, 0.16);
      background: white;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border-radius: 6px;
      border: 1.5px solid rgba(0, 0, 0, 0.2);
      background: white;
      position: relative;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    .question.selected .checkbox {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.03);
    }

    .question.selected .checkbox::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 2px;
      width: 6px;
      height: 12px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .question-text {
      font-size: 17px;
      line-height: 1.42;
    }

    .results {
      margin-top: 20px;
      padding: 18px;
      border-radius: 24px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .hidden { display: none; }

    .dominant {
      margin: 0 0 16px;
      font-size: 22px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .box {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.72);
    }

    .label {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .value {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .bar {
      height: 8px;
      margin-top: 12px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.08);
    }

    .fill {
      height: 100%;
      border-radius: 999px;
      background: #111;
    }

    @media (max-width: 680px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="hero" class="hero hidden">
      <img id="hero-image" alt="Image d'en-tête" />
    </div>

    <div class="topbar">
      <h1 id="title"></h1>
      <div class="actions">
        <button id="calculate-btn">Voir le résultat</button>
        <button id="reset-btn">Réinitialiser</button>
      </div>
    </div>

    <div id="questions" class="questions"></div>

    <div id="results" class="results hidden">
      <p id="dominant" class="dominant"></p>
      <div id="traits" class="grid"></div>
    </div>
  </div>

  <script>
    // Personnalisation : modifiez seulement SETTINGS, TRAITS et ITEMS

    const SETTINGS = {
      title: "Test",

      // Image tout en haut. Laissez vide pour ne rien afficher.
      topImage: "",

      // Image de fond. Laissez vide pour ne rien afficher.
      backgroundImage: ""
    };

    const TRAITS = {
      A: "Trait A",
      B: "Trait B",
      C: "Trait C",
      D: "Trait D"
    };

    const ITEMS = [
      {
        name: "Énergie sociale",
        threshold: 70,
        traits: { A: 35, B: 10 },
        phrases: [
          "J'aime être entouré de nombreuses personnes.",
          "Je prends facilement la parole en groupe.",
          "Les environnements stimulants me motivent.",
          "Je recherche souvent les échanges sociaux.",
          "Je me sens à l'aise dans les situations publiques."
        ]
      },
      {
        name: "Organisation",
        threshold: 70,
        traits: { B: 40 },
        phrases: [
          "Je planifie mes tâches à l'avance.",
          "J'aime que les choses soient structurées.",
          "Je respecte facilement un calendrier.",
          "Je préfère l'ordre à l'improvisation.",
          "Je termine ce que j'ai commencé."
        ]
      },
      {
        name: "Imagination",
        threshold: 70,
        traits: { C: 45 },
        phrases: [
          "J'aime explorer des idées nouvelles.",
          "Je fais souvent appel à mon imagination.",
          "Les concepts abstraits m'intéressent.",
          "Je cherche des solutions originales.",
          "J'aime expérimenter de nouvelles approches."
        ]
      },
      {
        name: "Stabilité émotionnelle",
        threshold: 70,
        traits: { D: 50 },
        phrases: [
          "Je garde mon calme sous pression.",
          "Je gère bien les imprévus.",
          "Je me remets vite d'un stress ponctuel.",
          "Je prends du recul face aux difficultés.",
          "Je reste globalement posé(e) dans les moments tendus."
        ]
      }
    ];

    const title = document.getElementById("title");
    const hero = document.getElementById("hero");
    const heroImage = document.getElementById("hero-image");
    const questions = document.getElementById("questions");
    const results = document.getElementById("results");
    const dominant = document.getElementById("dominant");
    const traitsBox = document.getElementById("traits");
    const selected = new Set();

    title.textContent = SETTINGS.title;

    if (SETTINGS.topImage) {
      hero.classList.remove("hidden");
      heroImage.src = SETTINGS.topImage;
    }

    if (SETTINGS.backgroundImage) {
      document.body.style.setProperty("--bg-image", `url('${SETTINGS.backgroundImage}')`);
    }

    const allPhrases = ITEMS.flatMap((item, itemIndex) =>
      item.phrases.map((text, phraseIndex) => ({
        id: `${itemIndex}-${phraseIndex}`,
        itemIndex,
        text
      }))
    );

    function shuffle(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderQuestions() {
      questions.innerHTML = "";

      shuffle(allPhrases).forEach(entry => {
        const el = document.createElement("div");
        el.className = "question";
        el.innerHTML = `
          <div class="checkbox"></div>
          <div class="question-text">${entry.text}</div>
        `;

        el.onclick = () => {
          if (selected.has(entry.id)) {
            selected.delete(entry.id);
            el.classList.remove("selected");
          } else {
            selected.add(entry.id);
            el.classList.add("selected");
          }
        };

        questions.appendChild(el);
      });
    }

    function getScores() {
      const scores = Object.fromEntries(Object.keys(TRAITS).map(k => [k, 0]));

      ITEMS.forEach((item, itemIndex) => {
        const checked = item.phrases.filter((_, phraseIndex) => selected.has(`${itemIndex}-${phraseIndex}`)).length;
        const percent = item.phrases.length ? (checked / item.phrases.length) * 100 : 0;
        const active = percent >= item.threshold;

        if (active) {
          Object.entries(item.traits).forEach(([trait, value]) => {
            scores[trait] += value;
          });
        }
      });

      const total = Object.values(scores).reduce((a, b) => a + b, 0);
      return Object.fromEntries(
        Object.entries(scores).map(([trait, value]) => [trait, total ? (value / total) * 100 : 0])
      );
    }

    function renderResults() {
      const scores = getScores();
      const ordered = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      const [best, bestValue] = ordered[0] || [];

      dominant.textContent = best ? `${best} — ${TRAITS[best]} (${bestValue.toFixed(0)}%)` : "";
      traitsBox.innerHTML = ordered.map(([trait, value]) => `
        <div class="box">
          <div class="label">${trait} — ${TRAITS[trait]}</div>
          <div class="value">${value.toFixed(0)}%</div>
          <div class="bar"><div class="fill" style="width:${value}%"></div></div>
        </div>
      `).join("");

      results.classList.remove("hidden");
      results.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    document.getElementById("calculate-btn").onclick = renderResults;
    document.getElementById("reset-btn").onclick = () => {
      selected.clear();
      results.classList.add("hidden");
      renderQuestions();
    };

    renderQuestions();
  </script>
</body>
</html>
