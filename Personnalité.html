<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(255,255,255,0.08);
      --panel-2: rgba(255,255,255,0.05);
      --text: #f8fafc;
      --muted: rgba(248,250,252,0.6);
      --line: rgba(255,255,255,0.08);
      --accent: #7c3aed;
      --accent-2: #22d3ee;
      --selected: rgba(124,58,237,0.22);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(124,58,237,0.30), transparent 30%),
        radial-gradient(circle at top right, rgba(34,211,238,0.18), transparent 28%),
        var(--bg);
    }

    .wrap {
      width: min(920px, calc(100% - 32px));
      margin: 32px auto 56px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: -0.03em;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease, background 0.18s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    #calculate-btn {
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    #reset-btn {
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .questions {
      display: grid;
      gap: 12px;
    }

    .question {
      padding: 18px 20px;
      border-radius: var(--radius);
      background: var(--panel-2);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      cursor: pointer;
      user-select: none;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .question:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.16);
      box-shadow: 0 14px 34px rgba(0,0,0,0.18);
    }

    .question.selected {
      background: linear-gradient(135deg, var(--selected), rgba(34,211,238,0.12));
      border-color: rgba(124,58,237,0.6);
      box-shadow: 0 16px 36px rgba(124,58,237,0.18);
    }

    .question-text {
      font-size: 17px;
      line-height: 1.45;
    }

    .results {
      margin-top: 22px;
      padding: 20px;
      border-radius: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .hidden { display: none; }

    .dominant {
      margin: 0 0 18px;
      font-size: 22px;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .box {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
    }

    .label {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .bar {
      height: 8px;
      margin-top: 12px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
    }

    .fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1 id="title"></h1>
      <div class="actions">
        <button id="calculate-btn">Voir le résultat</button>
        <button id="reset-btn">Réinitialiser</button>
      </div>
    </div>

    <div id="questions" class="questions"></div>

    <div id="results" class="results hidden">
      <p id="dominant" class="dominant"></p>
      <div id="traits" class="grid"></div>
    </div>
  </div>

  <script>
    // Personnalisation : modifiez uniquement TRAITS + ITEMS
    const TRAITS = {
      A: "Trait A",
      B: "Trait B",
      C: "Trait C",
      D: "Trait D"
    };

    const ITEMS = [
      {
        name: "Énergie sociale",
        threshold: 70,
        traits: { A: 35, B: 10 },
        phrases: [
          "J'aime être entouré de nombreuses personnes.",
          "Je prends facilement la parole en groupe.",
          "Les environnements stimulants me motivent.",
          "Je recherche souvent les échanges sociaux.",
          "Je me sens à l'aise dans les situations publiques."
        ]
      },
      {
        name: "Organisation",
        threshold: 70,
        traits: { B: 40 },
        phrases: [
          "Je planifie mes tâches à l'avance.",
          "J'aime que les choses soient structurées.",
          "Je respecte facilement un calendrier.",
          "Je préfère l'ordre à l'improvisation.",
          "Je termine ce que j'ai commencé."
        ]
      },
      {
        name: "Imagination",
        threshold: 70,
        traits: { C: 45 },
        phrases: [
          "J'aime explorer des idées nouvelles.",
          "Je fais souvent appel à mon imagination.",
          "Les concepts abstraits m'intéressent.",
          "Je cherche des solutions originales.",
          "J'aime expérimenter de nouvelles approches."
        ]
      },
      {
        name: "Stabilité émotionnelle",
        threshold: 70,
        traits: { D: 50 },
        phrases: [
          "Je garde mon calme sous pression.",
          "Je gère bien les imprévus.",
          "Je me remets vite d'un stress ponctuel.",
          "Je prends du recul face aux difficultés.",
          "Je reste globalement posé(e) dans les moments tendus."
        ]
      }
    ];

    const title = document.getElementById("title");
    const questions = document.getElementById("questions");
    const results = document.getElementById("results");
    const dominant = document.getElementById("dominant");
    const traitsBox = document.getElementById("traits");
    const selected = new Set();

    title.textContent = "Test";

    const allPhrases = ITEMS.flatMap((item, itemIndex) =>
      item.phrases.map((text, phraseIndex) => ({
        id: `${itemIndex}-${phraseIndex}`,
        itemIndex,
        text
      }))
    );

    function shuffle(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderQuestions() {
      questions.innerHTML = "";
      shuffle(allPhrases).forEach(entry => {
        const el = document.createElement("div");
        el.className = "question";
        el.innerHTML = `<div class="question-text">${entry.text}</div>`;
        el.onclick = () => {
          if (selected.has(entry.id)) {
            selected.delete(entry.id);
            el.classList.remove("selected");
          } else {
            selected.add(entry.id);
            el.classList.add("selected");
          }
        };
        questions.appendChild(el);
      });
    }

    function getScores() {
      const scores = Object.fromEntries(Object.keys(TRAITS).map(k => [k, 0]));

      ITEMS.forEach((item, itemIndex) => {
        const checked = item.phrases.filter((_, phraseIndex) => selected.has(`${itemIndex}-${phraseIndex}`)).length;
        const percent = item.phrases.length ? (checked / item.phrases.length) * 100 : 0;
        const active = percent >= item.threshold;

        if (active) {
          Object.entries(item.traits).forEach(([trait, value]) => {
            scores[trait] += value;
          });
        }
      });

      const total = Object.values(scores).reduce((a, b) => a + b, 0);
      return Object.fromEntries(
        Object.entries(scores).map(([trait, value]) => [trait, total ? (value / total) * 100 : 0])
      );
    }

    function renderResults() {
      const scores = getScores();
      const ordered = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      const [best, bestValue] = ordered[0];

      dominant.textContent = best ? `${best} — ${TRAITS[best]} (${bestValue.toFixed(0)}%)` : "";
      traitsBox.innerHTML = ordered.map(([trait, value]) => `
        <div class="box">
          <div class="label">${trait} — ${TRAITS[trait]}</div>
          <div class="value">${value.toFixed(0)}%</div>
          <div class="bar"><div class="fill" style="width:${value}%"></div></div>
        </div>
      `).join("");

      results.classList.remove("hidden");
      results.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    document.getElementById("calculate-btn").onclick = renderResults;
    document.getElementById("reset-btn").onclick = () => {
      selected.clear();
      results.classList.add("hidden");
      renderQuestions();
    };

    renderQuestions();
  </script>
</body>
</html>
