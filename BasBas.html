<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moteur de recherche personnalisé</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --border: #dfe1e5;
      --shadow: 0 2px 10px rgba(0,0,0,0.08);
      --blue: #1a73e8;
      --blue-hover: #1765cc;
      --result-hover: #f1f3f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    .logo {
      text-align: center;
      font-size: 3rem;
      font-weight: bold;
      letter-spacing: -1px;
      margin-bottom: 24px;
      color: #4285f4;
    }

    .logo span:nth-child(2) { color: #ea4335; }
    .logo span:nth-child(3) { color: #fbbc05; }
    .logo span:nth-child(4) { color: #4285f4; }
    .logo span:nth-child(5) { color: #34a853; }
    .logo span:nth-child(6) { color: #ea4335; }

    .search-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 12px 18px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1rem;
      background: transparent;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    button {
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 0.95rem;
