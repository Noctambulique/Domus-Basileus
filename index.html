<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>5 quartiers autour d’un cercle</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#000;
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .scene{
      width:min(720px, 92vw);
      aspect-ratio: 1/1;
      position:relative;
    }
    svg{ width:100%; height:100%; display:block; }
  </style>
</head>

<body>
  <div class="scene">
    <svg id="wheel" viewBox="0 0 600 600" aria-label="Anneau en 5 secteurs">
      <defs id="defs"></defs>
      <g id="layerImages"></g>
      <g id="layerLines"></g>

      <!-- Cercle central (au-dessus) -->
      <circle cx="300" cy="300" r="120" fill="#1a1a1a" stroke="#fff" stroke-width="10"></circle>
    </svg>
  </div>

  <script>
    // =============== CONFIG ===============
    const cx = 300, cy = 300;
    const rOuter = 280;   // rayon externe de l'anneau
    const rInner = 140;   // rayon interne (autour du cercle central)
    const strokeW = 8;

    // Remplace par tes images
    const images = [
      "https://picsum.photos/id/1011/1200/1200",
      "https://picsum.photos/id/1025/1200/1200",
      "https://picsum.photos/id/1035/1200/1200",
      "https://picsum.photos/id/1047/1200/1200",
      "https://picsum.photos/id/1062/1200/1200"
    ];

    // 5 secteurs égaux (72°) - départ en haut
    const sectors = Array.from({length: 5}, (_, i) => {
      const a0 = -90 + i * 72;
      const a1 = a0 + 72;
      return [a0, a1];
    });

    // =============== UTILS ===============
    const svg = document.getElementById("wheel");
    const defs = document.getElementById("defs");
    const layerImages = document.getElementById("layerImages");
    const layerLines = document.getElementById("layerLines");

    const toRad = d => (d * Math.PI) / 180;

    function polar(cx, cy, r, angDeg){
      const a = toRad(angDeg);
      return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
    }

    function annulusSectorPath(cx, cy, r0, r1, a0, a1){
      const p1 = polar(cx, cy, r1, a0);
      const p2 = polar(cx, cy, r1, a1);
      const p3 = polar(cx, cy, r0, a1);
      const p4 = polar(cx, cy, r0, a0);

      const largeArc = (a1 - a0) > 180 ? 1 : 0;

      return [
        `M ${p1.x} ${p1.y}`,
        `A ${r1} ${r1} 0 ${largeArc} 1 ${p2.x} ${p2.y}`,
        `L ${p3.x} ${p3.y}`,
        `A ${r0} ${r0} 0 ${largeArc} 0 ${p4.x} ${p4.y}`,
        "Z"
      ].join(" ");
    }

    function create(tag, attrs = {}){
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    // Pour compat image (certains navigateurs)
    function setHref(imgEl, url){
      imgEl.setAttribute("href", url);
      imgEl.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", url);
    }

    // =============== BUILD ===============
    sectors.forEach(([a0,a1], idx) => {
      const clipId = `clip-${idx}`;
      const d = annulusSectorPath(cx, cy, rInner, rOuter, a0, a1);

      // clipPath (important: userSpaceOnUse)
      const cp = create("clipPath", { id: clipId, clipPathUnits: "userSpaceOnUse" });
      cp.appendChild(create("path", { d }));
      defs.appendChild(cp);

      // image clippée
      const img = create("image", {
        x: 0, y: 0, width: 600, height: 600,
        preserveAspectRatio: "xMidYMid slice"
      });
      setHref(img, images[idx]);

      // ✅ ici le bug était: clip-path sans guillemets
      img.setAttribute("clip-path", `url(#${clipId})`);

      layerImages.appendChild(img);

      // contour blanc du secteur
      layerLines.appendChild(create("path", {
        d,
        fill: "transparent",
        stroke: "white",
        "stroke-width": strokeW,
        "stroke-linejoin": "round"
      }));
    });

    // cercles de l’anneau
    layerLines.appendChild(create("circle", {
      cx, cy, r: rOuter,
      fill: "transparent",
      stroke: "white",
      "stroke-width": strokeW
    }));

    layerLines.appendChild(create("circle", {
      cx, cy, r: rInner,
      fill: "transparent",
      stroke: "white",
      "stroke-width": strokeW
    }));
  </script>
</body>
</html>
