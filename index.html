<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Horloge</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(circle at center, #0b0b12, #000);
      color: #eaeaf0;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    .container {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
    }

    .clock {
      font-size: 72px;
      letter-spacing: 0.1em;
      opacity: 0.85;
    }

    button {
      background: transparent;
      border: 1px solid rgba(234,234,240,0.3);
      color: inherit;
      padding: 12px 28px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.7;
      transition: all 0.3s ease;
    }

    button:hover {
      opacity: 1;
      border-color: rgba(234,234,240,0.7);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="clock" id="clock">--:--</div>
    <button id="portal">Entrer</button>
  </div>

  <script>
    const clockEl = document.getElementById('clock');
    const button = document.getElementById('portal');

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      clockEl.textContent = `${h}:${m}`;
    }

    function getTargetPage() {
      const hour = new Date().getHours();

      // Personnalise ici les destinations
      if (hour >= 6 && hour < 12) return 'matin.html';
      if (hour >= 12 && hour < 18) return 'jour.html';
      if (hour >= 18 && hour < 22) return 'soir.html';
      return 'nuit.html';
    }

    button.addEventListener('click', () => {
      window.location.href = getTargetPage();
    });

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
