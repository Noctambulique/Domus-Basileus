<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Structure radiale personnalisable</title>
  <style>
    :root {
      --bg: #000;
      --line: #fff;
      --line-width: 8;
      --size: min(92vmin, 980px);
      --font: Arial, Helvetica, sans-serif;

      /* Cercles */
      --outer-ring-inner: 78;
      --middle-ring-inner: 42;
      --center-radius: 16;
      --center-double-gap: 1.8;

      /* Images : changer seulement ces variables pour personnaliser facilement */
      --img-top-start: 218;
      --img-top-end: 321;
      --img-top-inner: 42;
      --img-top-outer: 72;
      --img-top-url: url('https://picsum.photos/id/1011/900/500');

      --img-bottom-left-start: 148;
      --img-bottom-left-end: 182;
      --img-bottom-left-inner: 42;
      --img-bottom-left-outer: 58;
      --img-bottom-left-url: url('https://picsum.photos/id/1025/500/500');

      --img-bottom-right-start: 182;
      --img-bottom-right-end: 218;
      --img-bottom-right-inner: 42;
      --img-bottom-right-outer: 58;
      --img-bottom-right-url: url('https://picsum.photos/id/1005/500/500');

      /* Icônes / contenus flottants */
      --left-item-x: 26;
      --left-item-y: 60;
      --right-item-x: 73;
      --right-item-y: 58;

      /* Labels externes */
      --label-social-x: 50;
      --label-social-y: 10;
      --label-philo-x: 11;
      --label-philo-y: 37;
      --label-livre-x: 8;
      --label-livre-y: 57;
      --label-doc-x: 12;
      --label-doc-y: 75;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      font-family: var(--font);
    }

    .wheel {
      position: relative;
      width: var(--size);
      aspect-ratio: 1;
      background: var(--bg);
      border-radius: 50%;
      overflow: hidden;
    }

    /* Grand cercle externe */
    .wheel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: calc(var(--line-width) * 1px) solid var(--line);
      pointer-events: none;
      z-index: 10;
    }

    /* Grand cercle intermédiaire */
    .ring-middle {
      position: absolute;
      inset: calc((100% - (var(--middle-ring-inner) * 2%)) / 2);
      border-radius: 50%;
      border: calc(var(--line-width) * 1px) solid var(--line);
      z-index: 8;
      pointer-events: none;
    }

    /* Double cercle central */
    .center-outer,
    .center-inner {
      position: absolute;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .center-outer {
      width: calc(var(--center-radius) * 2% + var(--center-double-gap) * 2%);
      height: calc(var(--center-radius) * 2% + var(--center-double-gap) * 2%);
      border: calc(var(--line-width) * 1px) solid var(--line);
      z-index: 9;
    }

    .center-inner {
      width: calc(var(--center-radius) * 2%);
      height: calc(var(--center-radius) * 2%);
      border: calc(var(--line-width) * 1px) solid var(--line);
      z-index: 9;
      background: rgba(255,255,255,0.08);
    }

    /* Lignes radiales personnalisables */
    .line {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52%;
      height: calc(var(--line-width) * 1px);
      background: var(--line);
      transform-origin: 0 50%;
      z-index: 7;
    }

    /* Images en secteur via conic + radial mask */
    .sector-image {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background-image: var(--img-url);
      background-size: cover;
      background-position: center;
      z-index: 3;

      -webkit-mask-image:
        radial-gradient(circle at center,
          transparent 0 calc(var(--inner) * 1%),
          #000 calc(var(--inner) * 1%) calc(var(--outer) * 1%),
          transparent calc(var(--outer) * 1%) 100%),
        conic-gradient(from -90deg,
          transparent 0deg calc(var(--start) * 1deg),
          #000 calc(var(--start) * 1deg) calc(var(--end) * 1deg),
          transparent calc(var(--end) * 1deg) 360deg);
      -webkit-mask-composite: source-in;

      mask-image:
        radial-gradient(circle at center,
          transparent 0 calc(var(--inner) * 1%),
          #000 calc(var(--inner) * 1%) calc(var(--outer) * 1%),
          transparent calc(var(--outer) * 1%) 100%),
        conic-gradient(from -90deg,
          transparent 0deg calc(var(--start) * 1deg),
          #000 calc(var(--start) * 1deg) calc(var(--end) * 1deg),
          transparent calc(var(--end) * 1deg) 360deg);
      mask-composite: intersect;
    }

    .label {
      position: absolute;
      color: #fff;
      font-size: clamp(18px, 2.1vmin, 28px);
      font-weight: 500;
      transform: translate(-50%, -50%);
      z-index: 12;
      user-select: none;
    }

    .item {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 12;
      display: grid;
      place-items: center;
      color: #fff;
      user-select: none;
    }

    .item img {
      max-width: 84px;
      width: 7.5vmin;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.12));
    }

    .item.emoji {
      font-size: clamp(34px, 5vmin, 72px);
    }

    /* Petits repères pour personnalisation */
    .panel {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: 360px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(20,20,20,0.88);
      color: #fff;
      font-size: 14px;
      line-height: 1.45;
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(8px);
    }

    .panel code {
      color: #fff;
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="wheel">
    <!-- Images en secteurs : change simplement les variables CSS dans :root -->
    <div class="sector-image" style="--start: var(--img-top-start); --end: var(--img-top-end); --inner: var(--img-top-inner); --outer: var(--img-top-outer); --img-url: var(--img-top-url);"></div>
    <div class="sector-image" style="--start: var(--img-bottom-left-start); --end: var(--img-bottom-left-end); --inner: var(--img-bottom-left-inner); --outer: var(--img-bottom-left-outer); --img-url: var(--img-bottom-left-url);"></div>
    <div class="sector-image" style="--start: var(--img-bottom-right-start); --end: var(--img-bottom-right-end); --inner: var(--img-bottom-right-inner); --outer: var(--img-bottom-right-outer); --img-url: var(--img-bottom-right-url);"></div>

    <!-- Grandes lignes blanches -->
    <div class="line" style="transform: rotate(40deg);"></div>
    <div class="line" style="transform: rotate(140deg);"></div>
    <div class="line" style="transform: rotate(170deg);"></div>
    <div class="line" style="transform: rotate(228deg);"></div>
    <div class="line" style="transform: rotate(271deg);"></div>
    <div class="line" style="transform: rotate(320deg);"></div>

    <div class="ring-middle"></div>
    <div class="center-outer"></div>
    <div class="center-inner"></div>

    <!-- Labels externes -->
    <div class="label" style="left: calc(var(--label-social-x) * 1%); top: calc(var(--label-social-y) * 1%);">Social</div>
    <div class="label" style="left: calc(var(--label-philo-x) * 1%); top: calc(var(--label-philo-y) * 1%);">Philo</div>
    <div class="label" style="left: calc(var(--label-livre-x) * 1%); top: calc(var(--label-livre-y) * 1%);">Livre</div>
    <div class="label" style="left: calc(var(--label-doc-x) * 1%); top: calc(var(--label-doc-y) * 1%);">Doc</div>

    <!-- Contenus flottants remplaçables -->
    <div class="item emoji" style="left: calc(var(--left-item-x) * 1%); top: calc(var(--left-item-y) * 1%);">🏺</div>
    <div class="item emoji" style="left: calc(var(--right-item-x) * 1%); top: calc(var(--right-item-y) * 1%);">🎲</div>
  </div>

  <div class="panel">
    Modifie surtout les variables dans <code>:root</code>.<br>
    Pour changer une image, remplace <code>--img-*-url</code>.<br>
    Pour déplacer une séparation, change l'angle d'une <code>.line</code>.<br>
    Pour ajuster les anneaux, change <code>--middle-ring-inner</code> et <code>--center-radius</code>.
  </div>
</body>
</html>
