<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Débordement</title>
 <style>
  :root{
    --btn-bg: #0b141b;
    --btn-border: rgba(255,255,255,.75);
    --text: rgba(255,255,255,.92);
    --frame-gap: clamp(16px, 2vw, 30px);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#2b5561; /* ton fond */
    font-family: "MingLiU", "MingLiU", serif;
  }

  .stage{
    width: min(1400px, 95vw);
    min-height: 100vh;               /* évite que ça coupe */
    display:grid;
    grid-template-columns: 1fr minmax(240px, 460px) 1fr;
    gap: var(--frame-gap);
    align-items:center;
    padding: 40px 30px;              /* plus d’espace haut/bas */
  }

  .col{
    display:flex;
    flex-direction:column;
    gap: 22px;                       /* espace entre boutons réduit */
    justify-content:center;
  }

  .col.left{ align-items:flex-start; }
  .col.right{ align-items:flex-end; }

  .nav-btn{
    width: min(320px, 24vw);         /* plus petit */
    min-width: 240px;
    background: var(--btn-bg);
    color: var(--text);
    border: 2px solid var(--btn-border);
    padding: 20px 18px;              /* padding réduit */
    font-size: clamp(20px, 1.7vw, 30px); /* texte plus petit */
    line-height: 1.1;
    text-align:center;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .nav-btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(0,0,0,.25);
  }

  .center{
    display:flex;
    justify-content:center;
    align-items:flex-start;          /* remonte le vase */
    padding-top: 20px;               /* petit décalage vers le haut */
  }

  .center .hero{
    width: min(440px, 32vw);         /* vase plus petit */
    object-fit:contain;
  }

  /* Responsive */
  @media (max-width: 980px){
    .stage{
      grid-template-columns: 1fr;
      padding: 30px 20px;
    }

    .col.left, .col.right{
      align-items:center;
    }

    .nav-btn{
      width: 90%;
      min-width: 0;
    }

    .center{
      padding: 20px 0;
      align-items:center;
    }
  }
</style>
</head>

<body>
  <main class="stage">
    <!-- Colonne gauche -->
    <nav class="col left" aria-label="Navigation gauche">
      <button class="nav-btn" data-href="modele-de-debordement.html">Modèle de<br>débordement</button>
      <button class="nav-btn" data-href="evaluer-un-recipient.html">Evaluer un<br>récipient</button>
      <button class="nav-btn" data-href="strat-de-debordement.html">Strat de<br>débordement</button>
      <button class="nav-btn" data-href="historique-de-debordement.html">Historique de<br>débordement</button>
    </nav>

    <!-- Centre -->
    <section class="center" aria-label="Illustration centrale">
      <!-- Remplace src par ton image (ou enlève l'img si tu gères autrement) -->
      <img class="hero" src="Fond/Vase.png" alt="Illustration d'un vase" />
    </section>

    <!-- Colonne droite -->
    <nav class="col right" aria-label="Navigation droite">
      <button class="nav-btn" data-href="possibilite-de-debordement.html">Possibilité de<br>débordement</button>
      <button class="nav-btn" data-href="ideal-de-debordement.html">Idéal de<br>débordement</button>
      <button class="nav-btn" data-href="esthetique-de-debordement.html">Esthétique de<br>débordement</button>
    </nav>
  </main>

  <script>
    // Navigation : remplace les data-href par tes liens
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const href = btn.getAttribute("data-href");
        if (href) window.location.href = href;
      });
    });
  </script>
</body>
</html>
