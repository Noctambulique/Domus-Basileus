<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interface Débordement</title>
  <style>
    :root{
      --btn-bg: #0b141b;        /* noir/bleu très sombre */
      --btn-border: rgba(255,255,255,.75);
      --text: rgba(255,255,255,.92);
      --frame-gap: clamp(18px, 3vw, 40px);
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;

      /* Tu ajouteras ton fond ici */
      background: #2b5561; /* placeholder */
      font-family: "Georgia", "Times New Roman", serif;
    }

    /* Zone principale */
    .stage{
      width: min(1400px, 95vw);
      height: min(720px, 85vh);
      display: grid;
      grid-template-columns: 1fr minmax(260px, 520px) 1fr;
      gap: var(--frame-gap);
      align-items: center;
      padding: clamp(18px, 3vw, 40px);
      position: relative;
    }

    /* Colonnes de boutons */
    .col{
      display:flex;
      flex-direction:column;
      gap: clamp(18px, 2.2vw, 28px);
      justify-content: center;
      align-items: stretch;
    }
    .col.left{ align-items:flex-start; }
    .col.right{ align-items:flex-end; }

    /* Boutons */
    .nav-btn{
      width: min(360px, 28vw);
      min-width: 260px;
      background: var(--btn-bg);
      color: var(--text);
      border: 2px solid var(--btn-border);
      padding: 26px 22px;
      font-size: clamp(22px, 2.1vw, 36px);
      line-height: 1.05;
      letter-spacing: 0.5px;
      text-align: center;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }

    .nav-btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0,0,0,.25);
      border-color: rgba(255,255,255,.95);
    }

    .nav-btn:active{
      transform: translateY(0);
      box-shadow: none;
    }

    /* Centre (image/illustration) */
    .center{
      display:flex;
      justify-content:center;
      align-items:center;
      height: 100%;
    }

    .center .hero{
      width: min(520px, 38vw);
      max-height: 80%;
      object-fit: contain;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,.25));
    }

    /* Responsive: sur écran étroit, empilement */
    @media (max-width: 980px){
      .stage{
        height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }
      .col.left, .col.right{
        align-items: center;
      }
      .nav-btn{
        width: min(520px, 92vw);
        min-width: 0;
      }
      .center{
        padding: 14px 0;
      }
    }
  </style>
</head>

<body>
  <main class="stage">
    <!-- Colonne gauche -->
    <nav class="col left" aria-label="Navigation gauche">
      <button class="nav-btn" data-href="modele-de-debordement.html">Modèle de<br>débordement</button>
      <button class="nav-btn" data-href="evaluer-un-recipient.html">Evaluer un<br>récipient</button>
      <button class="nav-btn" data-href="strat-de-debordement.html">Strat de<br>débordement</button>
      <button class="nav-btn" data-href="historique-de-debordement.html">Historique de<br>débordement</button>
    </nav>

    <!-- Centre -->
    <section class="center" aria-label="Illustration centrale">
      <!-- Remplace src par ton image (ou enlève l'img si tu gères autrement) -->
      <img class="hero" src="Fond/Vase.png" alt="Illustration d'un vase" />
    </section>

    <!-- Colonne droite -->
    <nav class="col right" aria-label="Navigation droite">
      <button class="nav-btn" data-href="possibilite-de-debordement.html">Possibilité de<br>débordement</button>
      <button class="nav-btn" data-href="ideal-de-debordement.html">Idéal de<br>débordement</button>
      <button class="nav-btn" data-href="esthetique-de-debordement.html">Esthétique de<br>débordement</button>
    </nav>
  </main>

  <script>
    // Navigation : remplace les data-href par tes liens
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const href = btn.getAttribute("data-href");
        if (href) window.location.href = href;
      });
    });
  </script>
</body>
</html>
