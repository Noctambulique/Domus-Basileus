<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cercle + 4 images</title>
  <style>
    :root{
      --outer: 420px;      /* diamètre cercle extérieur */
      --inner: 140px;      /* diamètre cercle central */
      --gap: 18px;         /* espace entre extérieur et intérieur (visuel) */
      --bg: #0f1220;
      --ring: rgba(255,255,255,.15);
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1200px 600px at 50% 40%, #1a2050, var(--bg));
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .wrap{
      width: var(--outer);
      height: var(--outer);
      position: relative;
      display:grid;
      place-items:center;
    }

    /* Cercle extérieur (masque) */
    .outer{
      position:absolute;
      inset:0;
      border-radius:50%;
      overflow:hidden; /* important: tout est coupé dans le cercle */
      box-shadow: 0 18px 60px rgba(0,0,0,.55);
      outline: 2px solid var(--ring);
      background: rgba(255,255,255,.03);
    }

    /* Chaque quadrant prend la moitié largeur/hauteur */
    .quad{
      position:absolute;
      width:50%;
      height:50%;
      overflow:hidden; /* coupe l'image dans le quartier */
    }

    .q1{ left:0; top:0; }
    .q2{ right:0; top:0; }
    .q3{ left:0; bottom:0; }
    .q4{ right:0; bottom:0; }

    /* Images: couvrent leur zone, et donc seront coupées */
    .quad img{
      width:100%;
      height:100%;
      object-fit:cover;
      transform: scale(1.08); /* léger zoom pour plus joli */
      filter: saturate(1.05) contrast(1.05);
    }

    /* Ligne de séparation en croix */
    .outer::before,
    .outer::after{
      content:"";
      position:absolute;
      left:50%;
      top:0;
      width:2px;
      height:100%;
      background: rgba(255,255,255,.22);
      transform: translateX(-50%);
      pointer-events:none;
    }
    .outer::after{
      left:0;
      top:50%;
      width:100%;
      height:2px;
      transform: translateY(-50%);
    }

    /* Cercle central (par-dessus) */
    .inner{
      width: var(--inner);
      height: var(--inner);
      border-radius:50%;
      background: rgba(10,12,25,.85);
      outline: 2px solid rgba(255,255,255,.22);
      box-shadow: 0 14px 40px rgba(0,0,0,.55);
      position: relative;
      z-index: 2;
      display:grid;
      place-items:center;
    }

    /* Un petit “anneau” entre extérieur et intérieur (optionnel) */
    .inner::before{
      content:"";
      position:absolute;
      inset: calc(-1 * var(--gap));
      border-radius:50%;
      border: 2px solid rgba(255,255,255,.12);
      z-index:-1;
    }

    .label{
      color: rgba(255,255,255,.9);
      font-weight:700;
      letter-spacing:.4px;
      text-align:center;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.2;
    }

    /* Responsive */
    @media (max-width: 520px){
      :root{ --outer: 320px; --inner: 110px; --gap: 14px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="outer">
      <div class="quad q1">
        <img src="https://picsum.photos/id/1015/800/800" alt="image 1">
      </div>
      <div class="quad q2">
        <img src="https://picsum.photos/id/1025/800/800" alt="image 2">
      </div>
      <div class="quad q3">
        <img src="https://picsum.photos/id/1035/800/800" alt="image 3">
      </div>
      <div class="quad q4">
        <img src="https://picsum.photos/id/1041/800/800" alt="image 4">
      </div>
    </div>

    <div class="inner">
      <div class="label">Cercle<br>central</div>
    </div>
  </div>
</body>
</html>
