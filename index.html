<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Disque</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#000;
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .scene{ width:min(720px, 92vw); aspect-ratio:1/1; }
    svg{ width:100%; height:100%; display:block; }
  </style>
</head>

<body>
  <div class="scene">
    <svg viewBox="0 0 600 600">
      <defs id="defs"></defs>
      <g id="layerImages"></g>
      <g id="layerLines"></g>

      <circle cx="300" cy="300" r="120" fill="#1a1a1a" stroke="#fff" stroke-width="10"></circle>
    </svg>
  </div>

  <script>
    const cx = 300, cy = 300;
    const rOuter = 280;
    const rInner = 140;
    const strokeW = 8;

    // 🔥 Nouvelles tailles
    const images = [
      { src: "Fond/Rafael.png",  size: 230, offsetY: 30 },
      { src: "Fond/Octavie.png", size: 230, offsetY: 30 },
      { src: "Fond/Vase.png",    size: 180, offsetY: 0  },   // -10%
      { src: "Fond/Basile.png",  size: 415, offsetY: 100 },   // +20% total
      { src: "Fond/Dé.png",      size: 180, offsetY: 0  }    // -10%
    ];

    const smallDeg = 36;
    const bottomCenter = 90;
    const smallStart = bottomCenter - smallDeg;
    const smallMid   = bottomCenter;
    const smallEnd   = bottomCenter + smallDeg;

    const bigDeg = (360 - 2 * smallDeg) / 3;

    const sectors = [
      [smallStart, smallMid],
      [smallMid, smallEnd],
      [smallEnd, smallEnd + bigDeg],
      [smallEnd + bigDeg, smallEnd + 2*bigDeg],
      [smallEnd + 2*bigDeg, smallEnd + 3*bigDeg]
    ];

    const defs = document.getElementById("defs");
    const layerImages = document.getElementById("layerImages");
    const layerLines = document.getElementById("layerLines");

    const toRad = d => (d * Math.PI) / 180;

    function polar(cx, cy, r, angDeg){
      const a = toRad(angDeg);
      return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
    }

    function annulusSectorPath(cx, cy, r0, r1, a0, a1){
      const p1 = polar(cx, cy, r1, a0);
      const p2 = polar(cx, cy, r1, a1);
      const p3 = polar(cx, cy, r0, a1);
      const p4 = polar(cx, cy, r0, a0);
      const largeArc = (a1 - a0) > 180 ? 1 : 0;

      return [
        `M ${p1.x} ${p1.y}`,
        `A ${r1} ${r1} 0 ${largeArc} 1 ${p2.x} ${p2.y}`,
        `L ${p3.x} ${p3.y}`,
        `A ${r0} ${r0} 0 ${largeArc} 0 ${p4.x} ${p4.y}`,
        "Z"
      ].join(" ");
    }

    function create(tag, attrs = {}){
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function setHref(imgEl, url){
      imgEl.setAttribute("href", url);
      imgEl.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", url);
    }

    sectors.forEach(([a0,a1], idx) => {
      const clipId = `clip-${idx}`;
      const d = annulusSectorPath(cx, cy, rInner, rOuter, a0, a1);

      const cp = create("clipPath", { id: clipId, clipPathUnits: "userSpaceOnUse" });
      cp.appendChild(create("path", { d }));
      defs.appendChild(cp);

      const midAngle = (a0 + a1) / 2;
      const midRadius = (rInner + rOuter) / 2;
      const centerPos = polar(cx, cy, midRadius, midAngle);

      const imgSize = images[idx].size;

      const img = create("image", {
        x: centerPos.x - imgSize / 2,
        y: centerPos.y - imgSize / 2 + images[idx].offsetY,
        width: imgSize,
        height: imgSize,
        preserveAspectRatio: "xMidYMid slice"
      });

      setHref(img, images[idx].src);
      img.setAttribute("clip-path", `url(#${clipId})`);
      layerImages.appendChild(img);

      layerLines.appendChild(create("path", {
        d, fill:"transparent", stroke:"white",
        "stroke-width": strokeW, "stroke-linejoin":"round"
      }));
    });

    layerLines.appendChild(create("circle", {
      cx, cy, r: rOuter, fill:"transparent", stroke:"white", "stroke-width": strokeW
    }));
    layerLines.appendChild(create("circle", {
      cx, cy, r: rInner, fill:"transparent", stroke:"white", "stroke-width": strokeW
    }));
  </script>
</body>
</html>
