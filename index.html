<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Disque</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#000;
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .scene{ width:min(720px, 92vw); aspect-ratio:1/1; }
    svg{ width:100%; height:100%; display:block; }

    /* Bonus UX */
    a { cursor: pointer; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }
  </style>
</head>

<body>
  <div class="scene">
    <svg viewBox="0 0 600 600">
      <defs id="defs"></defs>
      <g id="layerLinks"></g>
      <g id="layerLines"></g>

      <circle cx="300" cy="300" r="120" fill="#1a1a1a" stroke="#fff" stroke-width="10"></circle>
    </svg>
  </div>

  <script>
    const cx = 300, cy = 300;
    const rOuter = 280;
    const rInner = 140;
    const strokeW = 8;

    // Images + réglages
    // - preserveAspectRatio est géré globalement via "meet" (pas de rognage)
    // - scale te permet d'agrandir/rétrécir sans couper (car "meet")
    const images = [
      { src: "Fond/Rafael.png",  size: 230, offsetY: 30,  scale: 1 },
      { src: "Fond/Octavie.png", size: 230, offsetY: 30,  scale: 1 },
      { src: "Fond/Vase.png",    size: 162, offsetY: 0,   scale: 1 },
      { src: "Fond/Basile.png",  size: 390, offsetY: 100, scale: 1 }, // <- ajuste scale ici si besoin
      { src: "Fond/Dé.png",      size: 162, offsetY: 0,   scale: 1 }
    ];

    // Liens cliquables (1 lien par case, même ordre que images[])
    const links = [
      "https://exemple.com/rafael",
      "https://exemple.com/octavie",
      "https://exemple.com/vase",
      "https://exemple.com/basile",
      "https://exemple.com/de"
    ];

    const smallDeg = 36;
    const bottomCenter = 90;
    const smallStart = bottomCenter - smallDeg;
    const smallMid   = bottomCenter;
    const smallEnd   = bottomCenter + smallDeg;

    const bigDeg = (360 - 2 * smallDeg) / 3;

    const sectors = [
      [smallStart, smallMid],
      [smallMid, smallEnd],
      [smallEnd, smallEnd + bigDeg],
      [smallEnd + bigDeg, smallEnd + 2*bigDeg],
      [smallEnd + 2*bigDeg, smallEnd + 3*bigDeg]
    ];

    const defs = document.getElementById("defs");
    const layerLinks = document.getElementById("layerLinks");
    const layerLines = document.getElementById("layerLines");

    const toRad = d => (d * Math.PI) / 180;

    function polar(cx, cy, r, angDeg){
      const a = toRad(angDeg);
      return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
    }

    function annulusSectorPath(cx, cy, r0, r1, a0, a1){
      const p1 = polar(cx, cy, r1, a0);
      const p2 = polar(cx, cy, r1, a1);
      const p3 = polar(cx, cy, r0, a1);
      const p4 = polar(cx, cy, r0, a0);
      const largeArc = (a1 - a0) > 180 ? 1 : 0;

      return [
        `M ${p1.x} ${p1.y}`,
        `A ${r1} ${r1} 0 ${largeArc} 1 ${p2.x} ${p2.y}`,
        `L ${p3.x} ${p3.y}`,
        `A ${r0} ${r0} 0 ${largeArc} 0 ${p4.x} ${p4.y}`,
        "Z"
      ].join(" ");
    }

    function create(tag, attrs = {}){
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function setHref(el, url){
      // SVG2
      el.setAttribute("href", url);
      // compat xlink
      el.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", url);
    }

    sectors.forEach(([a0,a1], idx) => {
      const clipId = `clip-${idx}`;
      const d = annulusSectorPath(cx, cy, rInner, rOuter, a0, a1);

      const cp = create("clipPath", { id: clipId, clipPathUnits: "userSpaceOnUse" });
      cp.appendChild(create("path", { d }));
      defs.appendChild(cp);

      const midAngle = (a0 + a1) / 2;
      const midRadius = (rInner + rOuter) / 2;
      const centerPos = polar(cx, cy, midRadius, midAngle);

      const imgSize = images[idx].size;
      const imgScale = images[idx].scale ?? 1;

      // Lien cliquable par secteur
      const a = create("a", { target: "_blank", rel: "noopener noreferrer" });
      setHref(a, links[idx]);

      // Groupe clippé
      const g = create("g", { "clip-path": `url(#${clipId})` });

      // Image (sans rognage)
      const img = create("image", {
        x: centerPos.x - imgSize / 2,
        y: centerPos.y - imgSize / 2 + images[idx].offsetY,
        width: imgSize,
        height: imgSize,
        preserveAspectRatio: "xMidYMid meet"
      });
      setHref(img, images[idx].src);

      // Si tu veux agrandir/rétrécir une image sans la couper :
      // on scale autour du centre du carré de l'image.
      if (imgScale !== 1) {
        const ox = centerPos.x;
        const oy = centerPos.y + images[idx].offsetY; // pivot cohérent avec offset
        img.setAttribute("transform", `translate(${ox} ${oy}) scale(${imgScale}) translate(${-ox} ${-oy})`);
      }

      g.appendChild(img);

      // Hit area (au cas où l'image a des zones transparentes)
      const hit = create("path", { d, fill: "transparent" });
      g.appendChild(hit);

      a.appendChild(g);
      layerLinks.appendChild(a);

      // Contour
      layerLines.appendChild(create("path", {
        d, fill:"transparent", stroke:"white",
        "stroke-width": strokeW, "stroke-linejoin":"round",
        "pointer-events":"none"
      }));
    });

    layerLines.appendChild(create("circle", {
      cx, cy, r: rOuter, fill:"transparent", stroke:"white", "stroke-width": strokeW,
      "pointer-events":"none"
    }));
    layerLines.appendChild(create("circle", {
      cx, cy, r: rInner, fill:"transparent", stroke:"white", "stroke-width": strokeW,
      "pointer-events":"none"
    }));
  </script>
</body>
</html>
