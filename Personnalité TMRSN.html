<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --text: #161616;
      --muted: #666;
      --panel: rgba(255, 255, 255, 0.86);
      --panel-strong: rgba(255, 255, 255, 0.96);
      --radius: 18px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background-color: #ece8e1;
      background-image: var(--bg-image, none);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.34);
      backdrop-filter: blur(2px);
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(920px, calc(100% - 28px));
      margin: 28px auto 56px;
    }

    .hero {
      margin-bottom: 22px;
    }

    .hero img {
      display: block;
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      height: auto;
      border-radius: 18px;
      box-shadow: var(--shadow);
      border: none;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(32px, 4vw, 46px);
      font-weight: 600;
      letter-spacing: -0.02em;
      text-align: center;
    }

    .questions {
      display: grid;
      gap: 10px;
    }

    .question {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 17px 18px;
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      cursor: pointer;
      user-select: none;
      transition: all 0.16s ease;
    }

    .question:hover {
      background: var(--panel-strong);
      transform: translateY(-1px);
    }

    .question.selected {
      background: white;
    }

    .checkbox {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      border-radius: 8px;
      border: 1.5px solid rgba(0, 0, 0, 0.14);
      background: linear-gradient(180deg, #ffffff, #f6f6f6);
      position: relative;
    }

    .question.selected .checkbox {
      background: #111;
      border-color: #111;
    }

    .question.selected .checkbox::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 3px;
      width: 6px;
      height: 12px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .question-text {
      font-size: 19px;
      line-height: 1.46;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 22px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      background: #111;
      color: white;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: all 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .results {
      margin-top: 26px;
      padding: 20px;
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .hidden {
      display: none;
    }

    .dominant {
      font-size: 28px;
      text-align: center;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .box {
      padding: 16px;
      border-radius: 18px;
      background: white;
    }

    .label {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .value {
      font-size: 30px;
      font-weight: 600;
    }

    .bar {
      height: 8px;
      margin-top: 12px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.08);
    }

    .fill {
      height: 100%;
      background: #111;
    }
  </style>
</head>

    }

    function buildPhrases() {
      return ITEMS.flatMap((item, itemIndex) =>
        item.phrases.map((text, phraseIndex) => ({
          id: `${itemIndex}-${phraseIndex}`,
          itemIndex,
          text
        }))
      );
    }

    function shuffle(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderQuestions() {
      questions.innerHTML = "";
      const allPhrases = shuffle(buildPhrases());

      allPhrases.forEach((entry) => {
        const el = document.createElement("div");
        el.className = "question";
        el.innerHTML = `
          <div class="checkbox"></div>
          <div class="question-text">${entry.text}</div>
        `;

        el.addEventListener("click", () => {
          if (selected.has(entry.id)) {
            selected.delete(entry.id);
            el.classList.remove("selected");
          } else {
            selected.add(entry.id);
            el.classList.add("selected");
          }
        });

        questions.appendChild(el);
      });
    }

    function getScores() {
      const details = Object.fromEntries(
        Object.keys(TRAITS).map((k) => [k, { active: 0, total: 0 }])
      );

      ITEMS.forEach((item, itemIndex) => {
        if (!details[item.trait]) return;

        details[item.trait].total += 1;

        const checked = item.phrases.filter((_, phraseIndex) =>
          selected.has(`${itemIndex}-${phraseIndex}`)
        ).length;

        const percent = item.phrases.length ? (checked / item.phrases.length) * 100 : 0;

        if (percent >= item.threshold) {
          details[item.trait].active += 1;
        }
      });

      return Object.fromEntries(
        Object.entries(details).map(([trait, info]) => [
          trait,
          info.total ? (info.active / info.total) * 100 : 0
        ])
      );
    }

    function renderResults() {
      const scores = getScores();
      const ordered = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      const [best, bestValue] = ordered[0] || ["A", 0];

      dominant.textContent = `${best} — ${TRAITS[best]} (${bestValue.toFixed(0)}%)`;

      traitsBox.innerHTML = ordered.map(([trait, value]) => `
        <div class="box">
          <div class="label">${trait} — ${TRAITS[trait]}</div>
          <div class="value">${value.toFixed(0)}%</div>
          <div class="bar"><div class="fill" style="width:${value}%"></div></div>
        </div>
      `).join("");

      results.classList.remove("hidden");
      results.scrollIntoView({ behavior: "smooth" });
    }

    document.getElementById("calculate-btn").addEventListener("click", renderResults);
